<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件街 · 广场</title>
<style>
  /* 场景保持像素，文字一律走正常抗锯齿 ——
     中文在 font-smoothing:none 下几乎不可读，像素味不值这个代价。 */
  :root{
    --ink:#2b2118; --ink2:#5c4a35; --cream:#f7eeda; --cream2:#e7d7b6;
    --line:#3b2f22; --up:#bf3129; --down:#1f7a48; --gold:#e0aa45; --blue:#3f6fa8;
    --ui:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    --num:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace;
    --px:0 0 0 3px var(--line);   /* 硬边框，代替圆角 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#1b222d; color:var(--ink); font-family:var(--ui); font-size:15px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #stage{position:relative}
  canvas{display:block; image-rendering:pixelated; background:#9fd8f2}

  /* NPC 头顶的话 —— 用 DOM 而不是 canvas，免得被最近邻放大糊掉 */
  #bubble{
    position:absolute; max-width:58%; padding:9px 13px; background:var(--cream);
    color:var(--ink); font-size:15px; line-height:1.5; letter-spacing:.3px;
    box-shadow:var(--px); pointer-events:none; transition:opacity .2s;
  }
  #bubble::after{
    content:""; position:absolute; right:16px; bottom:-11px;
    width:12px; height:8px; background:var(--cream);
    box-shadow:0 3px 0 0 var(--line), 3px 0 0 0 var(--line), -3px 0 0 0 var(--line);
  }
  #bubble b{color:var(--up)}

  /* 教学村头顶的常驻门牌——不用走近就看得见，跟 hint/bubble 那套「靠近才显示」不是一回事 */
  #roomLabel{
    position:absolute; transform:translateX(-50%); white-space:nowrap; pointer-events:none;
    background:rgba(20,15,10,.86); color:var(--gold); font-weight:700; letter-spacing:.5px;
    padding:3px 9px; box-shadow:0 0 0 2px rgba(20,15,10,.86);
  }

  .hint{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:rgba(20,15,10,.88); color:#f7eeda; padding:8px 18px;
    font-size:15px; letter-spacing:1px; white-space:nowrap; pointer-events:none;
    box-shadow:0 0 0 3px rgba(20,15,10,.88);
    transition:opacity .15s; opacity:0;
  }
  .hint.on{opacity:1}
  .hint kbd{
    font-family:var(--num); background:var(--gold); color:#2b2118;
    padding:1px 7px; margin:0 3px; font-size:14px;
  }
  /* 左上角常驻的玩家条 */
  .corner{
    position:absolute; left:14px; bottom:14px; padding:8px 14px; cursor:pointer;
    background:rgba(20,15,10,.86); color:#f7eeda; font-size:14px; line-height:1.5;
    box-shadow:0 0 0 3px rgba(20,15,10,.86); z-index:5;
  }
  .corner:hover{background:rgba(20,15,10,.96)}
  .corner b{color:var(--gold); font-family:var(--num); font-size:16px}
  .corner span{opacity:.65; font-size:12.5px}
  .home{
    position:absolute; right:14px; top:14px; padding:8px 14px; z-index:5;
    background:rgba(20,15,10,.86); color:#f7eeda; font-size:13px;
    box-shadow:0 0 0 3px rgba(20,15,10,.86); text-decoration:none;
  }
  .home:hover{background:rgba(20,15,10,.96); color:var(--gold)}
  /* 右上角的中/EN 切换。样式跟 .home 一个模子，叠在它下面。 */
  .lang{
    position:absolute; right:14px; top:57px; padding:8px 14px; z-index:5; cursor:pointer;
    background:rgba(20,15,10,.86); color:#f7eeda; font-size:13px; font-family:var(--ui);
    box-shadow:0 0 0 3px rgba(20,15,10,.86); border:0; letter-spacing:1px;
  }
  .lang:hover{background:rgba(20,15,10,.96)}
  .lang b{color:var(--gold)}

  /* ---------- 对话框 ---------- */
  #dlg,#bag,#roomDlg{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(12,10,8,.6); z-index:20; padding:20px;
  }
  #dlg.on,#bag.on,#roomDlg.on{display:flex}
  canvas.face{image-rendering:pixelated; padding:5px}

  /* 背包：称号 / 道具 / 皮肤 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .card{
    background:#fff; padding:13px 15px; box-shadow:inset 0 0 0 3px var(--line);
    display:flex; flex-direction:column; gap:6px;
  }
  .card.locked{background:#efe6d2; color:var(--ink2)}
  .card.on{background:#fff6dd; box-shadow:inset 0 0 0 3px var(--line), inset 0 0 0 8px var(--gold)}
  .card .t{font-size:16px; font-weight:700}
  .card .d{font-size:13px; color:var(--ink2); line-height:1.6; flex:1}
  .card button{
    padding:8px 10px; font-family:var(--ui); font-size:14px; cursor:pointer;
    background:var(--cream2); border:0; box-shadow:inset 0 0 0 3px var(--line);
  }
  .card button:hover:not(:disabled){background:var(--gold)}
  .card button:disabled{opacity:.45; cursor:default}
  .swatch{width:100%; height:52px; box-shadow:inset 0 0 0 3px var(--line)}
  .nickrow{display:flex; gap:10px; align-items:center; margin:10px 0 4px}
  .nickrow input{
    flex:1; padding:10px 13px; font-family:var(--ui); font-size:16px; color:var(--ink);
    background:#fff; border:0; box-shadow:inset 0 0 0 3px var(--line);
  }
  .panel{
    width:min(960px,96vw); max-height:94vh; display:flex; flex-direction:column;
    background:var(--cream); color:var(--ink);
    box-shadow:0 0 0 3px var(--line), 0 0 0 7px var(--cream), 0 0 0 10px var(--line),
               12px 12px 0 10px rgba(0,0,0,.32);
  }
  .head{display:flex; gap:14px; align-items:center; padding:16px 20px; border-bottom:3px solid var(--line)}
  .face{
    width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:32px;
    background:var(--cream2); box-shadow:inset 0 0 0 3px var(--line);
  }
  .who h1{font-size:23px; letter-spacing:1px}
  .who .sub{font-size:14px; color:var(--ink2); margin-top:5px; line-height:1.5}
  .mood{margin-left:auto; text-align:right; font-size:13px; color:var(--ink2); flex:none}
  .mood b{
    display:block; margin-top:5px; font-size:17px; color:var(--ink);
    background:var(--gold); padding:5px 12px; box-shadow:inset 0 0 0 3px var(--line);
  }

  .tabs{display:flex; border-bottom:3px solid var(--line); background:var(--cream2)}
  .tabs button{
    flex:1; padding:13px 4px; font-family:var(--ui); font-size:16px; letter-spacing:3px;
    background:none; border:0; border-right:3px solid var(--line); cursor:pointer; color:var(--ink2);
  }
  .tabs button:last-child{border-right:0}
  .tabs button:hover{background:#efe3c6}
  .tabs button[aria-selected="true"]{background:var(--cream); color:var(--ink); font-weight:700}

  .modes{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center}
  .modes button{
    padding:8px 16px; font-family:var(--ui); font-size:14px; cursor:pointer;
    background:#fff; border:0; box-shadow:inset 0 0 0 3px var(--line); color:var(--ink2);
  }
  .modes button[aria-pressed="true"]{background:var(--gold); color:var(--ink); font-weight:700}
  .days{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}
  .days button{
    padding:5px 11px; font-family:var(--num); font-size:13px; cursor:pointer;
    background:#fff; border:0; box-shadow:inset 0 0 0 2px var(--line); color:var(--ink2);
  }
  .days button[aria-pressed="true"]{background:var(--blue); color:#fff}

  .body{padding:20px 22px; overflow:auto; flex:1; font-size:15px; line-height:1.8}
  .tab{display:none} .tab.on{display:block}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:7px 20px; margin:12px 0}
  .kv dt{color:var(--ink2)} .kv dd{font-weight:700; font-family:var(--num)}

  .quote{
    background:#fffaf0; padding:14px 16px; margin:10px 0; font-size:14px;
    line-height:1.85; white-space:pre-wrap; box-shadow:inset 0 0 0 3px var(--line);
    max-height:230px; overflow:auto; color:var(--ink);
  }
  .tag{
    display:inline-block; margin:4px 7px 4px 0; padding:5px 12px; font-size:14px;
    background:#fff; box-shadow:inset 0 0 0 3px var(--line);
  }
  .lead{color:var(--ink2); margin-top:18px; font-size:14px}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:10px; margin-bottom:16px}
  .stat{background:#fff; padding:11px 13px; box-shadow:inset 0 0 0 3px var(--line)}
  .stat span{display:block; font-size:13px; color:var(--ink2); margin-bottom:2px}
  .stat b{font-size:21px; font-family:var(--num); letter-spacing:-.5px}

  table{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
  th,td{padding:8px 9px; text-align:right; border-bottom:2px solid var(--cream2)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--ink2); font-weight:400; font-size:13px; border-bottom:3px solid var(--line)}
  td{font-family:var(--num)}
  td.reason,td.txt{text-align:left; font-family:var(--ui)}
  td.reason{color:var(--ink2); font-size:13px}
  tbody tr:hover{background:#fffaf0}
  .up{color:var(--up)} .down{color:var(--down)}

  /* ---------- 对赌盘 ---------- */
  .bet{background:#fff; padding:16px; margin-bottom:14px; box-shadow:inset 0 0 0 3px var(--line)}
  .bet .q{font-size:17px; font-weight:700; margin-bottom:6px}
  .bet .say{font-size:14px; color:var(--ink2); margin-bottom:13px; line-height:1.65}
  .odds{display:flex; gap:10px; margin-bottom:8px}
  .odds button{
    flex:1; padding:13px 8px; font-family:var(--ui); font-size:14px; cursor:pointer;
    background:var(--cream2); border:0; box-shadow:inset 0 0 0 3px var(--line); line-height:1.55;
  }
  .odds button:hover:not(:disabled){background:var(--gold)}
  .odds button:disabled{opacity:.4; cursor:default}
  .odds b{display:block; font-size:24px; font-family:var(--num); margin:3px 0}
  .odds i{font-style:normal; font-size:13px; color:var(--ink2); font-family:var(--num)}
  .stakes{display:flex; gap:8px; align-items:center; font-size:14px; color:var(--ink2)}
  .stakes button{
    padding:7px 16px; font-family:var(--num); font-size:14px; cursor:pointer; background:#fff;
    border:0; box-shadow:inset 0 0 0 3px var(--line);
  }
  .stakes button[aria-pressed="true"]{background:var(--blue); color:#fff}
  .stakes button:disabled{opacity:.4; cursor:default}
  .result{margin-top:12px; padding:11px 13px; font-size:14px; line-height:1.7;
          box-shadow:inset 0 0 0 3px var(--line)}
  .result.win{background:#dff0e2} .result.lose{background:#f9dcdc}

  /* ---------- 8人局新手教学 ---------- */
  /* 选项按钮存在感往下调，题目和 thesis 才是这张卡片该先看到的东西 */
  .room-bet .q{font-size:18px; font-weight:700; margin-bottom:8px}
  .room-bet .say{font-size:14.5px; line-height:1.7; margin-bottom:11px}
  .room-odds{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:6px}
  .room-odds button{
    padding:7px 3px; font-family:var(--ui); font-size:11.5px; cursor:pointer;
    background:var(--cream2); border:0; box-shadow:inset 0 0 0 2px var(--line); line-height:1.4;
  }
  .room-odds button:hover:not(:disabled){background:var(--gold)}
  .room-odds button:disabled{opacity:.4; cursor:default}
  .room-odds button.duel{background:#f3d9cf}
  .room-odds button.duel:hover:not(:disabled){background:#e8b49f}
  .room-odds b{display:block; font-size:12.5px; font-family:var(--num); margin-bottom:1px}
  .room-detail-link{
    display:block; margin:2px 0 10px; padding:0; font-family:var(--ui); font-size:12.5px;
    background:none; border:0; color:var(--blue); text-decoration:underline; cursor:pointer;
  }
  .room-table{width:100%; margin:10px 0; font-size:13.5px}
  .room-table td,.room-table th{padding:6px 8px}
  .room-table tr.you{background:#fff6dd}
  .room-banner{
    text-align:center; padding:14px; margin-bottom:14px; font-size:17px; font-weight:700;
    box-shadow:inset 0 0 0 3px var(--line);
  }
  .room-banner.win{background:#f6d9c9; color:var(--up)}
  .room-banner.lose{background:#dff0e2; color:var(--down)}
  .face.bust{background:#f9dcdc}
  .room-advance{
    width:100%; padding:13px; margin-top:10px; font-family:var(--ui); font-size:15px;
    font-weight:700; cursor:pointer; background:var(--gold); border:0;
    box-shadow:inset 0 0 0 3px var(--line);
  }
  .room-advance:hover:not(:disabled){background:#eec46a}
  .room-advance:disabled{opacity:.4; cursor:default}

  /* 参与度进度条——红跟蓝，不再靠一行字数多空 */
  .room-crowd{margin:0 0 12px}
  .room-crowd .bar{display:flex; height:9px; box-shadow:inset 0 0 0 2px var(--line); background:#fff; overflow:hidden}
  .room-crowd .seg-red{background:var(--up)}
  .room-crowd .seg-blue{background:var(--blue)}
  .room-crowd .lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--ink2); margin-top:3px}

  /* 今日/历史 切页 */
  .room-nav{display:flex; gap:8px; margin-bottom:14px}
  .room-nav button{
    padding:8px 18px; font-family:var(--ui); font-size:13px; cursor:pointer;
    background:#fff; border:0; box-shadow:inset 0 0 0 3px var(--line); color:var(--ink2);
  }
  .room-nav button[aria-pressed="true"]{background:var(--gold); color:var(--ink); font-weight:700}
  .history-list{max-height:52vh; overflow-y:auto; padding-right:4px}
  .room-back{
    padding:7px 14px; margin-bottom:14px; font-family:var(--ui); font-size:13px; cursor:pointer;
    background:#fff; border:0; box-shadow:inset 0 0 0 3px var(--line); color:var(--ink2);
  }
  .room-back:hover{background:var(--cream2)}

  /* 圆桌——庄家坐正中心，闲家沿边摆开，信息藏在人物后面，点一下才冒出来 */
  .table-toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px}
  .table-toolbar .lead{margin:0}
  .table-layout{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap}
  .table-main{flex:1 1 320px; min-width:280px}
  /* 右手边：今日题目简略版（点开才是完整版），取代原来杵在这儿的桌面记录 */
  .table-side{flex:1 1 220px; min-width:200px; max-width:280px}
  .table-side h3,.table-log-wrap h3{
    font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink2);
    margin-bottom:8px; font-weight:400;
  }
  .brief-list{display:flex; flex-direction:column; gap:6px; margin-bottom:8px}
  .brief-row{
    padding:9px 11px; background:#fff; box-shadow:inset 0 0 0 3px var(--line);
    cursor:pointer; font-size:13px;
  }
  .brief-row:hover{background:var(--cream2)}
  .brief-row.active{background:#fff6dd; box-shadow:inset 0 0 0 3px var(--line), inset 0 0 0 6px var(--gold)}
  .brief-row .dir{color:var(--up); font-weight:700; margin-right:5px}
  .brief-row .done-tag{float:right; font-size:11px; color:var(--ink2)}

  /* 桌面记录挪到最下面、缩小、靠 overflow 出滑动轴 */
  .table-log-wrap{margin-top:16px}
  .table-log{
    max-height:130px; overflow-y:auto; background:#fff; box-shadow:inset 0 0 0 3px var(--line);
    padding:8px 10px; font-size:10.5px;
  }
  .log-day{
    font-family:var(--num); font-size:10.5px; color:var(--ink2); margin:8px 0 2px;
    border-top:1px solid var(--cream2); padding-top:5px;
  }
  .log-day:first-child{margin-top:0; border-top:none; padding-top:0}
  .log-row{padding:1px 0; line-height:1.5}
  .log-row b{font-family:var(--num)}
  .table-wrap{position:relative; width:100%; max-width:360px; aspect-ratio:1; margin:6px auto 14px}
  .table-felt{
    position:absolute; inset:9%; border-radius:50%; background:#17301f;
    box-shadow:inset 0 0 0 3px #0d1f13, 0 0 0 4px var(--gold), 0 5px 0 0 rgba(0,0,0,.28);
  }
  .seat{
    position:absolute; width:58px; margin-left:-29px; margin-top:-29px;
    text-align:center; cursor:pointer; user-select:none;
  }
  .seat .av{
    width:44px; height:44px; margin:0 auto; border-radius:50%; background:#fff;
    box-shadow:inset 0 0 0 3px var(--line); display:grid; place-items:center; font-size:22px;
  }
  .seat.you .av{box-shadow:inset 0 0 0 3px var(--line), inset 0 0 0 6px var(--gold)}
  .seat:hover .av,.seat.active .av{box-shadow:inset 0 0 0 3px var(--blue), 0 0 0 2px var(--blue)}
  .seat .nm{
    font-size:10.5px; margin-top:3px; color:#f7eeda; text-shadow:0 1px 2px rgba(0,0,0,.7);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .seat .cash{font-size:10px; font-family:var(--num); color:var(--gold); text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .seat.dealer{width:76px; margin-left:-38px; margin-top:-38px; left:50%; top:50%; z-index:2}
  .seat.dealer .av{
    width:60px; height:60px; font-size:30px; background:var(--cream2);
    box-shadow:inset 0 0 0 3px var(--gold), 0 0 0 3px var(--line);
  }
  .seat.dealer:hover .av{box-shadow:inset 0 0 0 3px var(--gold), 0 0 0 3px var(--up)}
  .seat.dealer .badge{
    position:absolute; top:-3px; right:6px; background:var(--up); color:#fff;
    font-size:10px; font-family:var(--num); font-weight:700; border-radius:50%;
    width:17px; height:17px; display:grid; place-items:center; box-shadow:0 0 0 2px var(--cream);
  }
  .seat-info{
    min-height:74px; max-height:280px; overflow-y:auto; background:#fff;
    box-shadow:inset 0 0 0 3px var(--line); padding:11px 13px; margin-bottom:14px;
    font-size:13px; line-height:1.6;
  }
  .seat-info .hd{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px}
  .seat-info .hd b{font-size:15px}
  .seat-info .pnl{font-family:var(--num); font-weight:700}
  .seat-info .pick{display:inline-block; margin:2px 8px 2px 0; padding:2px 8px; background:var(--cream2); font-size:12px}
  /* 庄家头像划过去弹出的两个入口，不是信息，是动作 */
  .dealer-menu{display:flex; flex-direction:column; gap:6px; margin-top:6px}
  .dealer-menu button{
    padding:9px 13px; font-family:var(--ui); font-size:13.5px; cursor:pointer; text-align:left;
    background:var(--cream2); border:0; box-shadow:inset 0 0 0 3px var(--line);
  }
  .dealer-menu button:hover{background:var(--gold)}
  /* day几做了什么，倒序列表，每行右边挂当天盈亏 */
  .day-log{margin-top:4px}
  .day-row{padding:5px 0; border-bottom:1px solid var(--cream2); font-size:12px; overflow:hidden}
  .day-row:last-child{border-bottom:none}
  .day-row b{margin-right:6px}
  .day-row .pick{display:inline-block; margin:0 6px 2px 0; padding:1px 6px; background:var(--cream2); font-size:11px}
  .room-back:hover{background:var(--cream2)}

  /* 候机室 */
  .lobby-dealer{display:flex; gap:14px; align-items:center; padding:14px; background:#fff;
    box-shadow:inset 0 0 0 3px var(--line); margin-bottom:14px}
  .lobby-dealer .avatar{
    width:54px; height:54px; flex:none; display:grid; place-items:center; font-size:30px;
    background:var(--cream2); box-shadow:inset 0 0 0 3px var(--line);
  }
  .lobby-dealer .info h2{font-size:18px}
  .lobby-dealer .info .theme{font-size:13px; color:var(--ink2); margin-top:4px}
  .roster{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; margin-bottom:16px}
  .roster .seat{background:#fff; box-shadow:inset 0 0 0 3px var(--line); padding:10px 4px; text-align:center}
  .roster .seat.you{box-shadow:inset 0 0 0 3px var(--line), inset 0 0 0 6px var(--gold); background:#fff6dd}
  .roster .seat .av{font-size:24px}
  .roster .seat .nm{font-size:11.5px; margin-top:4px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chatlog{
    background:#fff; box-shadow:inset 0 0 0 3px var(--line); padding:10px 12px;
    height:130px; overflow-y:auto; font-size:13px; margin-bottom:8px;
  }
  .chatlog .line{margin-bottom:7px; line-height:1.55}
  .chatlog .line b{color:#8a6a1f}
  .chatrow{display:flex; gap:8px; margin-bottom:16px}
  .chatrow input{
    flex:1; padding:8px 11px; font-family:var(--ui); font-size:13px; background:#fff;

  }

</style>

  ? window.BOOK.agents
  : (window.BOOK ? [window.BOOK] : null);

  '<p style="color:#f6ecd6;font-family:monospace;padding:40px;line-height:2">'
  + '缺少 book.js。先运行：<br><br>&nbsp;&nbsp;python -m agent.backfill --days 20</p>';

let dlgB = null;                 // 对话打开时的 book 快照。面板一律读它，别读会被帧循环偷换的 B。
const dlgBook = () => dlgB || B;

/* book.js 的数据要进 innerHTML，一律先过这里。引号也转，属性位才安全。 */
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function sprite(map, x, y, flip, over, g = cx){
  for (let r = 0; r < map.length; r++)
    for (let c = 0; c < map[r].length; c++){
      const ch = map[r][c];
      const col = (over && over[ch]) || PAL[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x + (flip ? map[r].length - 1 - c : c), y + r, 1, 1);
    }
}

function playerStats(){
  const log = Object.values(P.bets).filter(r => !r.practice && (r.ok === true || r.ok === false));
  const agg = rows => {
    const n = rows.length, w = rows.filter(r => r.ok).length;
    return { n, w, rate: n ? w / n : null,
             pnl: rows.reduce((m, r) => m + (r.ok ? r.win - r.stake : -r.stake), 0) };
  };
  return {
    all: agg(log),
    yes: agg(log.filter(r => r.side === 'YES')),
    no:  agg(log.filter(r => r.side === 'NO')),
    log: log.slice().sort((a, b) => (b.seq || 0) - (a.seq || 0)),
  };
}

function nearestTo(x, y){
  let best = null, bestD = 1e9;
  for (const n of INTERACTABLES){
    const d = Math.hypot(x - n.x, y - n.y);
    if (d < bestD){ bestD = d; best = n; }
  }
  return best;
}
function nearNpc(){
  const n = nearestTo(hero.x, hero.y);
  if (!n) return null;
  return (Math.abs(hero.x - n.x) < 58 && hero.y - n.y < 78) ? n : null;
}

  B = n.book;
  histDay = null;
  openDlg();
}

function drawStall(x){
  const w = 68, awnY = 50, backY = 60, cntY = 92;
  cx.fillStyle = '#7a5c3c'; cx.fillRect(x + 2, backY, w - 4, cntY - backY + 10);
  cx.fillStyle = '#8a6a44'; cx.fillRect(x + 5, backY + 3, w - 10, 26);
  cx.fillStyle = '#c4362f'; cx.fillRect(x - 4, awnY, w + 8, 10);
  cx.fillStyle = '#f6ecd6';
  for (let px = x - 4; px < x + w + 8; px += 10) cx.fillRect(px, awnY, 5, 10);
  cx.fillStyle = '#3b2f22'; cx.fillRect(x - 4, awnY + 10, w + 8, 2);
}
function drawCounter(x){
  const w = 68, cntY = 92;
  cx.fillStyle = '#6b4f33'; cx.fillRect(x - 3, cntY, w + 6, 14);
  cx.fillStyle = '#8a6a44'; cx.fillRect(x - 3, cntY, w + 6, 4);
  cx.fillStyle = '#3b2f22'; cx.fillRect(x - 3, cntY + 13, w + 6, 2);
  cx.fillStyle = '#f6ecd6'; cx.fillRect(x + 6, cntY + 5, 16, 7);
  cx.fillStyle = '#a4906c';
  for (let y = cntY + 7; y < cntY + 12; y += 2) cx.fillRect(x + 8, y, 12, 1);
}

/* 教学村是一栋房子，不是摊位——一眼看出这是个要走进去的地方，
   不是找人聊两句的摊。房顶阶梯金边呼应赌桌配色，跟两个庄家摊位区分开。 */

  cx.fillStyle = '#3b2f22'; cx.fillRect(x - 1, 47, w + 2, 2);

  cx.fillStyle = '#17301f'; cx.fillRect(x, 49, w, 45);
  cx.fillStyle = '#24422f'; cx.fillRect(x + 3, 52, w - 6, 6);

  cx.fillStyle = '#9fd8f2'; cx.fillRect(x + 11, 59, 12, 10);
  cx.fillStyle = '#9fd8f2'; cx.fillRect(x + w - 23, 59, 12, 10);
  cx.fillStyle = '#3b2f22';
  cx.fillRect(x + 11, 63, 12, 2); cx.fillRect(x + 16, 59, 2, 10);
  cx.fillRect(x + w - 23, 63, 12, 2); cx.fillRect(x + w - 18, 59, 2, 10);

function drawBack(){
  cx.fillStyle = '#9fd8f2'; cx.fillRect(0, 0, 320, 62);          // 天
  cx.fillStyle = '#7bc86c'; cx.fillRect(0, 62, 320, 118);        // 草
  // 广场石板
  cx.fillStyle = '#d9c49a'; cx.fillRect(24, 84, 272, 88);
  cx.fillStyle = '#cbb488';
  for (let y = 84; y < 172; y += 8)
    for (let x = 24 + ((y / 8) % 2 ? 4 : 0); x < 296; x += 16) cx.fillRect(x, y, 8, 1);
  cx.fillStyle = '#b8a074';
  for (let x = 24; x < 296; x += 8) cx.fillRect(x, 84, 4, 1);

  for (const tx of [16, 52, 268, 302]){
    cx.fillStyle = '#5f4a30'; cx.fillRect(tx + 5, 54, 3, 14);
    cx.fillStyle = '#4e9b46'; cx.fillRect(tx, 40, 13, 14);
    cx.fillStyle = '#63b356'; cx.fillRect(tx + 2, 38, 9, 10);
  }

  for (const n of CAST) drawStall(n.stallX);
  if (ROOM_SPOT) drawRoomHouse(ROOM_SPOT.stallX);
}

function drawFront(){
  for (const n of CAST) drawCounter(n.stallX);
}

/* 任务感叹号：飘在他头顶、压在雨棚前面，才读得出「这个人有事找你」。
   nearNpc 每帧只在 loop 里算一次，这里吃传进来的结果。 */
function drawMarker(t, n){
  if (!n) return;
  const bob = Math.round(Math.sin(t / 320) * 2);
  const x = n.x + 6, y = 58 + bob;
  cx.fillStyle = '#2b1d18'; cx.fillRect(x - 2, y - 2, 8, 16);
  cx.fillStyle = '#f4e06a'; cx.fillRect(x, y, 4, 9);
  cx.fillRect(x, y + 10, 4, 2);
}

/* 气泡是 DOM 元素，跟着画布缩放定位 —— 这样文字始终是清晰的矢量渲染。
   两个函数每帧都会被 loop 叫到，所以各自记住上次写进 DOM 的状态：
   最近的 NPC / 缩放 / 语言没变就直接返回，不重排样式、不重写 innerHTML。 */
const bubbleEl = document.getElementById('bubble');
let bubblePosKey = null;   // 上次定位：NPC × SCALE
let bubbleTxtKey = null;   // 上次文案：NPC × lang（BOOKS 静态，idea 随 book 定死）
function placeBubble(near = nearNpc()){
  const n = near || CAST[0];
  if (!n) return;
  const key = CAST.indexOf(n) + ':' + SCALE;
  if (key === bubblePosKey) return;
  bubblePosKey = key;
  bubbleEl.style.right = (320 - n.x - 14) * SCALE + 'px';
  bubbleEl.style.top = 8 * SCALE + 'px';
  bubbleEl.style.fontSize = Math.max(15, Math.round(SCALE * 6.5)) + 'px';
  bubbleEl.style.padding = `${SCALE * 3}px ${SCALE * 4}px`;
}
function fillBubble(near = nearNpc()){
  const n = near || CAST[0];
  const key = lang + ':' + (n ? CAST.indexOf(n) : -1);
  if (key === bubbleTxtKey) return;
  bubbleTxtKey = key;
  const idea = n && liveIdeasOf(n.book)[0];
  if (!idea){ bubbleEl.style.display = 'none'; return; }
  bubbleEl.style.display = '';
  bubbleEl.innerHTML =
    T('bubbleAsk', esc(idea.ticker), idea.horizon || 1, Math.round(idea.price * 100));
}
function fillRoomBubble(){
  const key = lang + ':room';
  if (key === bubbleTxtKey) return;
  bubbleTxtKey = key;
  bubbleEl.style.display = '';
  bubbleEl.innerHTML = T('bubbleRoom');
}

let last = 0;
const hintEl = document.getElementById('hint');
let hintTxtKey = null;     // hint 上次写的（NPC × lang），相同就不动 innerHTML
let hintOnLast = null;     // hint 上次的显隐
let bubbleOpLast = null;   // 气泡上次的透明度
function loop(t){
  const dt = Math.min(40, t - last); last = t;
  const busy = dlgOpen() || bagOpen() || roomDlgOpen();
  let dx = 0, dy = 0;
  if (!busy){                       // 面板打开时忽略移动键，人别在背后乱走
    if (keys.a || keys.arrowleft) dx -= 1;
    if (keys.d || keys.arrowright) dx += 1;
    if (keys.w || keys.arrowup) dy -= 1;
    if (keys.s || keys.arrowdown) dy += 1;
  }
  if (dx || dy){
    const n = Math.hypot(dx, dy) || 1, sp = dt * 0.055;
    hero.x = Math.max(28, Math.min(286, hero.x + dx / n * sp));
    hero.y = Math.max(112, Math.min(154, hero.y + dy / n * sp));
    if (dx) hero.f = dx < 0;
    hero.step += dt;
  }

  const who = nearNpc();            // 每帧只扫一次，画标记/hint/气泡全吃这个结果

  drawBack();
  for (const n of CAST)
    sprite(NPC, n.x, n.y + (Math.sin(t / 500) > 0 ? 0 : 1), false, n.pal);
  drawFront();
  cx.fillStyle = 'rgba(0,0,0,.16)';
  cx.fillRect(Math.round(hero.x) + 2, Math.round(hero.y) + 16, 12, 3);
  const hop = (dx || dy) && Math.floor(hero.step / 140) % 2 ? 1 : 0;
  sprite(HERO, Math.round(hero.x), Math.round(hero.y) - hop, hero.f, skinPal(P.skin));
  drawMarker(t, who);

  const hintOn = !!who && !busy;
  if (hintOn !== hintOnLast){ hintEl.classList.toggle('on', hintOn); hintOnLast = hintOn; }
  if (who){
    const key = lang + ':' + (who.isRoom ? 'room' : CAST.indexOf(who));
    if (key !== hintTxtKey){          // 最近 NPC 或语言变了才重写
      hintTxtKey = key;
      hintEl.innerHTML = who.isRoom
        ? T('hintRoom')
        : T('hintTalk', esc(aName(who.book.agent)) || T('vendor'));
    }
  }
  const op = busy ? '0' : '1';
  if (op !== bubbleOpLast){ bubbleEl.style.opacity = op; bubbleOpLast = op; }
  /* 面板打开时不许换 B —— 正看着的摊主不能被走近的另一个偷换掉。教学摊没有 book，不动 B。
     placeBubble 只用 n.x 定位，两边都能调；文案要分开，教学摊没有 idea 可读。 */
  if (who && !busy){
    if (who.isRoom) fillRoomBubble(); else { B = who.book; fillBubble(who); }
    placeBubble(who);
  }
  requestAnimationFrame(loop);
}

}

/* 存档指纹：generated_for 相同但 Jack 同日重生成过 room.js（题目变/天数变短）时，
   旧存档的 bets/dayReached 会悬空指向不存在的题和天。把计划天数、实际天数和
   全部题目 id 一起揉进指纹，任何一处变了都当作新房间处理。 */
function roomFingerprint(){
  return [RD.generated_for, RD.days_planned, (RD.days || []).length,
    (RD.days || []).map(d => d.ideas.map(i => i.id).join(',')).join('|')].join('#');
}
function freshRoomState(){
  return {
    generatedFor: RD.generated_for,
    fp: roomFingerprint(),
    ready: false,     // 候机室 → 准备好了才正式开局
    chat: [],
    cash: RD.config.player_initial_cash,
    dayReached: 1,
    revealed: {},
    bets: {},
    dealerDelta: 0,   // 你对赌给庄家造成的累计净影响
    ended: null,
  };
}

let roomToastTimer = null;
function roomToast(msg){
  let el = document.getElementById('roomToast');
  if (!el){ el = document.createElement('div'); el.id = 'roomToast'; document.body.appendChild(el); }

  el.classList.add('on');

  roomToastTimer = setTimeout(() => el.classList.remove('on'), 3200);
}
function roomState(){
  if (!P.room || P.room.fp !== roomFingerprint()){
    const hadOld = !!P.room;          // 全新玩家静默开局；旧档失效才提示
    P.room = freshRoomState();        // 只重置 P.room，主存档（代币/皮肤/注单）不动
    saveP();
    if (hadOld) roomToast(RT('roomDataRefreshed'));
  }
  return P.room;
}

}

function roomDayOf(idx){ return (RD.days || []).find(d => d.day_idx === idx); }

function roomLastRevealed(S){

  return (base != null ? base : RD.dealer.start_cash) + S.dealerDelta;
}
const roomDealerBankruptLine = () => RD.dealer.start_cash * (1 - RD.config.bankrupt_pct);
const roomYouBankruptLine = () => RD.config.player_initial_cash * (1 - RD.config.bankrupt_pct);

/* 结算公式和 agent/room.py 的 _settle 同源：跟/反都是 stake/price 对系统结算，
   对赌另在 roomReveal 里叠一层庄家过账——胜负判定不变，只是钱从哪儿来不同。 */
function roomSettle(action, price, stake){
  const sidePrice = action === '跟' ? price : Math.round((1 - price) * 10000) / 10000;
  return { sidePrice, payout: stake / sidePrice };
}

/* 注只在 roomReveal 才真扣钱，同一天几道题可以同时挂注——注金约束一律按
   「现金 − 其它未结算注（非 skip）的已押合计」这个可用额来，保证总敞口 ≤ 现金，
   全输也只是归零，不会出现负资产。改自己那笔时把自己从占用里剔掉（exceptId），
   不然换注码档永远显得没钱。 */
function roomCommittedStake(S, exceptId){
  let total = 0;
  for (const [id, b] of Object.entries(S.bets)){
    if (id === exceptId || !b || b.action === 'skip' || b.result) continue;
    total += b.stake || 0;
  }
  return total;
}
function roomAvailCash(S, exceptId){
  return Math.max(0, Math.round((S.cash - roomCommittedStake(S, exceptId)) * 100) / 100);
}
function roomStakeCap(S, idea, action){
  const avail = roomAvailCash(S, idea.id);
  return action === '对赌' ? Math.min(RD.config.duel_cap, avail) : avail;
}

function roomPlaceBet(S, idea, action){
  if (action === 'skip'){ S.bets[idea.id] = { action: 'skip' }; saveP(); renderRoom(); return; }
  const cap = roomStakeCap(S, idea, action);   // 对赌 = min(duel_cap, 可用额)；跟/反 = 可用额
  const floor = action === '对赌' ? RD.config.dealer_min_stake : RD.config.player_min_stake;
  if (cap < floor){ alert(RT('notEnough')); return; }
  const stake = Math.min(cap, Math.max(floor, Math.round(S.cash * 0.15)));
  S.bets[idea.id] = { action, price: idea.price, stakeMax: cap, stakeFloor: floor, stake };
  saveP(); renderRoom();
}
function roomSetStake(S, idea, v){
  const b = S.bets[idea.id];
  if (!b || b.action === 'skip' || b.result) return;
  if (v > roomStakeCap(S, idea, b.action)) return;   // 超出可用额：按钮已置灰，这里是兜底
  b.stake = v; saveP(); renderRoom();
}

function roomReveal(S, dayIdx){
  const day = roomDayOf(dayIdx);
  if (!day) return roomRecover();
  (day.ideas || []).forEach(idea => {
    const b = S.bets[idea.id];
    if (!b || b.action === 'skip') return;
    const { sidePrice, payout } = roomSettle(b.action, idea.price, b.stake);
    const won = b.action === '跟' ? idea.outcome === 'YES' : idea.outcome === 'NO';
    const delta = won ? payout - b.stake : -b.stake;
    S.cash = Math.round((S.cash + delta) * 100) / 100;
    b.result = { won, delta: Math.round(delta * 100) / 100 };

    if (b.action === '对赌'){
      const dealerDelta = won ? -delta : b.stake;   // 你赢庄家就亏，你输庄家就赚
      S.dealerDelta = Math.round((S.dealerDelta + dealerDelta) * 100) / 100;
      if (!S.ended && roomDealerCash(S) < roomDealerBankruptLine())
        S.ended = { reason: 'you_beat_dealer', day: dayIdx };
    }
  });

  S.revealed[dayIdx] = true;
  /* 终检：当天全部注单入账、revealed 置位之后再查一次破产线。上面对赌瞬间那次
     即时判定用的基数是昨天的 dealer_cash_after，不含今天 NPC 对赌的伤害，只能
     提前触发、不能兜底；这里 roomDealerCash 已经读到今天的 dealer_cash_after +
     你的累计 dealerDelta，NPC 和你的合力打穿也能收住。 */
  if (!S.ended && roomDealerCash(S) < roomDealerBankruptLine())
    S.ended = { reason: S.dealerDelta < 0 ? 'you_beat_dealer' : 'dealer_bankrupt', day: dayIdx };
  if (!S.ended && S.cash < roomYouBankruptLine()) S.ended = { reason: 'you_bankrupt', day: dayIdx };
  if (!S.ended && dayIdx >= RD.days.length)
    S.ended = { reason: (RD.ended_early && RD.ended_early.reason) || 'day5', day: dayIdx };
  if (!S.ended) S.dayReached = Math.min(RD.days.length, dayIdx + 1);
  roomOpenIdeaId = null;    // 翻页了，右边展开的那条题目跟着昨天一起收起来
  saveP(); renderRoom();
}

function roomAllDecided(day, S){ return (day.ideas || []).every(i => S.bets[i.id]); }

function roomCrowdBar(idea){

/* 圆桌上每个闲家的信息都是「藏在人物后面」的——不算进已揭晓的天，
   免得鼠标一划就把还没开盖的结果剧透了。跟对赌的 delta 同源公式，
   room.py 的 npc_bets 里已经把 payout / dealer_delta 都算好了，
   这里只是按玩家、按天重新汇总一遍。 */
function npcBetDelta(bet){
  if (!bet.result) return 0;
  if (bet.action === '对赌') return -(bet.result.dealer_delta || 0);
  return (bet.result.payout || 0) - bet.stake;
}
function npcRunningCash(pid, S){
  let cash = RD.config.player_initial_cash;
  for (const day of RD.days){
    if (!S.revealed[day.day_idx]) break;
    for (const idea of day.ideas)
      for (const bet of (idea.npc_bets || []))
        if (bet.player_id === pid) cash += npcBetDelta(bet);
  }
  return cash;
}
function npcDayDelta(pid, day){
  let total = 0;
  for (const idea of day.ideas)
    for (const bet of (idea.npc_bets || []))
      if (bet.player_id === pid) total += npcBetDelta(bet);
  return total;
}
function npcTodayPicks(pid, day){
  const out = [];
  for (const idea of day.ideas){
    const bet = (idea.npc_bets || []).find(b => b.player_id === pid);
    if (bet) out.push({ idea, bet });
  }
  return out;
}

/* N 个座位沿一个圆均匀摆开，从正上方开始顺时针；庄家单独坐正中心，不占位。 */
function layoutSeats(n, radiusPct){
  const seats = [];
  for (let i = 0; i < n; i++){
    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
    seats.push({ left: (50 + radiusPct * Math.cos(angle)).toFixed(2),
                top: (50 + radiusPct * Math.sin(angle)).toFixed(2) });
  }
  return seats;
}

/* 权益曲线——跟标的详情页的 sparkline 是同一支笔，只是喂进去的是资产
   而不是股价，起点固定是带入本金，只画已揭晓的天，不剧透还没开盖的。 */
/* 盈亏柱状图——不画累计权益的曲线，直接画每天赚了/亏了多少钱，
   数字标在柱子上，一眼看出哪天赢哪天输，赢多少输多少。 */
function dayPnlBarChart(rows){
  if (!rows.length) return `<p class="lead" style="margin:0">${RT('noCurveYet')}</p>`;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.delta)));
  const W = 260, H = 78, gap = 8, pad = 4;
  const barW = (W - pad * 2 - gap * (rows.length - 1)) / rows.length;
  const midY = H / 2;
  const half = H / 2 - 16;
  const bars = rows.map((r, i) => {
    const x = pad + i * (barW + gap);
    const h = Math.max(1, (Math.abs(r.delta) / maxAbs) * half);
    const up = r.delta >= 0;
    const y = up ? midY - h : midY;
    const color = up ? '#bf3129' : '#1f7a48';
    const labelY = up ? y - 3 : y + h + 11;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}"/>
      <text x="${(x + barW / 2).toFixed(1)}" y="${labelY.toFixed(1)}" font-size="9.5" text-anchor="middle" fill="${color}">${up ? '+' : ''}${Math.round(r.delta)}</text>
      <text x="${(x + barW / 2).toFixed(1)}" y="${(H - 2).toFixed(1)}" font-size="8.5" text-anchor="middle" fill="#8a7355">D${r.day.day_idx}</text>`;
  }).join('');
  return `<div class="chart-wrap" style="margin:6px 0 8px; padding:5px">
    <svg viewBox="0 0 ${W} ${H}" role="img" style="height:78px">
      <line x1="4" y1="${midY}" x2="${W - 4}" y2="${midY}" stroke="#cbb488" stroke-width="1"/>
      ${bars}
    </svg></div>`;
}

function npcDayBreakdown(pid, S){
  const rows = [];
  for (const day of RD.days){
    if (!S.revealed[day.day_idx]) break;
    rows.push({ day, picks: npcTodayPicks(pid, day), delta: npcDayDelta(pid, day) });
  }
  return rows;
}
function youDayBreakdown(S){
  const rows = [];

    }

  return rows;
}
/* day几做了什么——按天倒着列，每天下面是那天的题+动作，右边挂当天盈亏。

}

function seatInfoHtml(pid, S, day){
  if (pid === 'dealer'){
    return `<div class="hd"><b>${esc(RD.dealer.emoji || '🎩')} ${esc(RD.dealer.name)}</b></div>
      <div class="dealer-menu">

  const isYou = pid === 'you';
  const p = isYou ? null : RD.players.find(x => x.id === pid);
  if (!isYou && !p) return '';
  const name = isYou ? P.nick : p.name;
  const emoji = isYou ? '🧑' : p.emoji;
  const cash = isYou ? S.cash : npcRunningCash(pid, S);
  const rows = isYou ? youDayBreakdown(S) : npcDayBreakdown(pid, S);
  const todayRevealed = !!S.revealed[day.day_idx];
  const todayPicks = isYou
    ? day.ideas.map(i => ({ idea: i, bet: S.bets[i.id] })).filter(x => x.bet && x.bet.action !== 'skip')
    : npcTodayPicks(pid, day);

  return `<div class="hd"><b>${esc(emoji)} ${esc(name)}</b><span class="pnl">${money(cash)}</span></div>
    ${!todayRevealed ? `<p class="lead" style="margin:0 0 4px">

          ? todayPicks.map(({ idea, bet }) => `<span class="pick">${esc(idea.ticker)} ${esc(bet.action)}</span>`).join('')
          : RT('noPickToday')}
      </p>` : ''}
    ${dayPnlBarChart(rows)}
    ${dayBreakdownHtml(rows)}`;
}

function roomIdeaCard(idea, S, opts){
  const readonly = !!(opts && opts.readonly);
  const b = S.bets[idea.id];
  const avail = roomAvailCash(S, idea.id);   // 现金 − 当天其它未结算注的已押合计
  let body;
  if (!b){
    body = readonly
      ? `<div class="result">${RT('noBetPlaced')}${idea.outcome
          ? ` · ${RT('answer')} <b class="${idea.outcome === 'YES' ? 'up' : 'down'}">${esc(idea.outcome)}</b>` : ''}</div>`
      : `<div class="room-odds">
          <button data-rpick="${esc(idea.id)}" data-raction="跟"
            ${avail < RD.config.player_min_stake ? 'disabled' : ''}><b>${RT('follow')}</b>${(idea.price * 100).toFixed(0)}¢</button>
          <button data-rpick="${esc(idea.id)}" data-raction="反"
            ${avail < RD.config.player_min_stake ? 'disabled' : ''}><b>${RT('fade')}</b>${((1 - idea.price) * 100).toFixed(0)}¢</button>
          <button class="duel" data-rpick="${esc(idea.id)}" data-raction="对赌"
            ${avail < RD.config.dealer_min_stake ? 'disabled' : ''}><b>${RT('duel')}</b>${((1 - idea.price) * 100).toFixed(0)}¢</button>
          <button data-rpick="${esc(idea.id)}" data-raction="skip"><b>${RT('skip')}</b></button>
        </div>`;
  } else if (b.action === 'skip'){
    body = `<div class="result">${RT('lockedSkip')}</div>`;
  } else if (!b.result){
    const price = b.action === '跟' ? idea.price : Math.round((1 - idea.price) * 100) / 100;
    const label = RT(b.action === '跟' ? 'follow' : b.action === '反' ? 'fade' : 'duel');
    const cap = roomStakeCap(S, idea, b.action);   // 换档实时按可用额算，别信下注瞬间存的 stakeMax
    const presets = b.action === '对赌'
      ? [RD.config.dealer_min_stake, 1500, 2000].filter(v => v <= RD.config.duel_cap)
      : [200, 500, 1000, 2000];
    body = `
      <div class="result">${RT('lockedPicked', label, Math.round(price * 100))}</div>
      <div class="stakes" style="margin-top:8px">${RT('stakeLbl')}
        ${presets.map(v => `<button data-rstake="${esc(idea.id)}" data-v="${v}"
          ${v > cap ? 'disabled' : ''} aria-pressed="${v === b.stake}">${v}</button>`).join('')}
      </div>`;
  } else {
    const won = b.result.won;
    body = `<div class="result ${won ? 'win' : 'lose'}">
      ${esc(idea.ticker)} ${esc(idea.ref_date)} → ${esc(idea.exit_date || '')}
      · ${RT('answer')} <b>${esc(idea.outcome)}</b><br>
      ${esc(b.action)} ${b.stake} · <b>${RT('winLabel', won)}${Math.abs(b.result.delta)}</b>
    </div>`;
  }

  return `<div class="bet room-bet">
    <div class="q">${esc(idea.question)}</div>
    <div class="say">${esc(idea.reason || '')} <span style="opacity:.7">（${esc(idea.mood || '')}）</span></div>
    ${roomCrowdBar(idea)}
    <button class="room-detail-link" data-rdetail="${esc(idea.id)}">${RT('viewDetail')} →</button>
    ${body}
  </div>`;
}

/* 简版 futu 风的标的详情——真实 K 线，没有花哨的技术指标库，纯手写 SVG 折线。 */
/* K 线——真实开高低收，不是折线。ref_date 那根描蓝框（庄家挂盘那一刻），
   exit_date 那根描金框（到期结算那一刻），一眼看出问题问的是哪一段。 */
/* 一年左右的窗口，260 根蜡烛硬塞进固定宽度会糊成一条黑线，所以图按
   每根蜡烛的最小像素宽度撑开实际宽度，外层横向滚动——跟 futu 一个思路：
   宁可滚，不可糊。渲染完默认滚到最右边，那是 ref/exit 所在、最要紧的一段。 */
let roomChartPx = 4;   // 当前每根蜡烛的像素宽度（缩放状态），每次打开新详情页重置

/* 价格网格+重复标签——图很宽，标签只画一处一滚就看不见了，所以沿整个
   宽度每隔一段重复画一次，不管停在哪儿视野里总有一个。 */
function buildCandlesSvg(chart, refDate, exitDate, px){
  const lo = Math.min(...chart.map(c => c.low)), hi = Math.max(...chart.map(c => c.high));
  const span = Math.max(1e-6, hi - lo);
  const n = chart.length;
  const H = 132, pad = 4;
  const W = Math.max(300, Math.round(n * px));
  const slot = (W - pad * 2) / n;
  const bodyW = Math.max(1, slot * 0.62);
  const y = v => H - pad - ((v - lo) / span) * (H - pad * 2);

  let grid = '';
  const levels = 4;
  for (let i = 0; i <= levels; i++){
    const price = lo + (span * i) / levels;
    const yy = y(price);
    grid += `<line x1="0" y1="${yy.toFixed(1)}" x2="${W}" y2="${yy.toFixed(1)}" stroke="#e4dac0" stroke-width="1" stroke-dasharray="2,3"/>`;
    for (let lx = 2; lx < W; lx += 280)
      grid += `<text x="${lx + 2}" y="${(yy - 2).toFixed(1)}" font-size="8.5" fill="#8a7355">${price.toFixed(2)}</text>`;
  }
  const candles = chart.map((c, i) => {
    const cx = pad + slot * (i + 0.5);
    const up = c.close >= c.open;
    const color = up ? '#bf3129' : '#1f7a48';
    const bodyTop = y(Math.max(c.open, c.close));
    const bodyBot = y(Math.min(c.open, c.close));
    const mark = c.date === refDate ? '#3f6fa8' : (c.date === exitDate ? '#c9a227' : '');
    return `<line x1="${cx.toFixed(1)}" y1="${y(c.high).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${y(c.low).toFixed(1)}"
        stroke="${color}" stroke-width="1"/>
      <rect x="${(cx - bodyW / 2).toFixed(1)}" y="${bodyTop.toFixed(1)}"
        width="${bodyW.toFixed(1)}" height="${Math.max(1, bodyBot - bodyTop).toFixed(1)}" fill="${color}"
        ${mark ? `stroke="${mark}" stroke-width="1.6"` : ''}/>`;
  }).join('');
  return { svg: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" style="display:block">${grid}${candles}</svg>`,
          W, H, pad, slot };
}

/* 图的交互全挂在这——划过看 OHLC（价格条替成 futu 那种「划到哪读到哪」），
   滚轮缩放（锚定在鼠标下面那根蜡烛，不会跳来跳去），按住拖拽平移。
   #roomBody 每次整体重渲染，监听器全挂在图自己的容器上，不碰 window/
   document，面板关掉容器被卸载监听器就跟着没了，不用手动清。 */
function mountChart(idea, chartArg, revealed){
  /* chartArg = renderDetail 按揭晓状态截好的窗口；未揭晓时不描 exit 金框——
     那根蜡烛本来就被截掉了，日期也不该提前露出来。 */
  const chart = chartArg || idea.chart;
  const host = $('chartSvgHost'), scroller = $('chartScroll'), cross = $('chartCrosshair');
  if (!host || !scroller || !chart || chart.length < 2) return;
  roomChartPx = 4;
  let geo = null;

  const paint = () => {
    const built = buildCandlesSvg(chart, idea.ref_date, revealed ? idea.exit_date : null, roomChartPx);
    host.innerHTML = built.svg;
    geo = built;
  };
  paint();
  scroller.scrollLeft = scroller.scrollWidth;   // 默认滚到最右边——ref/exit 那一小段才要紧

  const heroDefault = () => {
    const hero = $('roomBody').querySelector('.price-hero');
    if (hero) hero.innerHTML = `<span class="px">${esc(idea.ref_close)}</span>
      <span class="lead" style="margin:0">${RT('asOf')} ${esc(idea.ref_date)}</span>`;
  };
  const showCandle = c => {
    cross.style.display = '';
    cross.querySelector('.ch-line').style.left = (geo.pad + geo.slot * (chart.indexOf(c) + 0.5)) + 'px';
    cross.querySelector('.ch-line').style.height = geo.H + 'px';
    const hero = $('roomBody').querySelector('.price-hero');
    const up = c.close >= c.open;
    if (hero) hero.innerHTML = `<span class="px ${up ? 'up' : 'down'}">${c.close}</span>
      <span class="lead" style="margin:0">${esc(c.date)} · O ${c.open} H ${c.high} L ${c.low} C ${c.close}
      ${c.volume ? ' · V ' + Math.round(c.volume / 1000).toLocaleString('en-US') + 'K' : ''}</span>`;
  };

  let dragging = false, dragX = 0, dragScroll = 0;
  scroller.addEventListener('mousedown', e => {
    dragging = true; dragX = e.clientX; dragScroll = scroller.scrollLeft;
    scroller.classList.add('grabbing');
  });
  scroller.addEventListener('mouseup', () => { dragging = false; scroller.classList.remove('grabbing'); });
  scroller.addEventListener('mouseleave', () => {
    dragging = false; scroller.classList.remove('grabbing');
    cross.style.display = 'none'; heroDefault();
  });
  scroller.addEventListener('mousemove', e => {
    if (dragging) scroller.scrollLeft = dragScroll - (e.clientX - dragX);
    const rect = scroller.getBoundingClientRect();
    const localX = scroller.scrollLeft + (e.clientX - rect.left);
    const idx = Math.max(0, Math.min(chart.length - 1, Math.round((localX - geo.pad) / geo.slot - 0.5)));
    showCandle(chart[idx]);
  });
  scroller.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = scroller.getBoundingClientRect();
    const cursorX = e.clientX - rect.left;
    const contentX = scroller.scrollLeft + cursorX;
    const oldPx = roomChartPx;
    roomChartPx = Math.max(2, Math.min(24, roomChartPx * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    paint();
    scroller.scrollLeft = contentX * (roomChartPx / oldPx) - cursorX;
  }, { passive: false });
}

function fmtCap(n){
  if (n == null) return '—';
  if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  return '$' + money(n);
}

/* ref_date 那天自己的 K 线 + 52 周高低，都是从已经拉到的一年窗口里现算的，
   不需要额外接口。信念度这里不放——庄家自己信不信不重要，标的本身的
   基本面和走势才是。 */
function renderDetail(S){
  const idea = findRoomIdea(roomDetailId);
  if (!idea){ roomView = 'table'; return renderRoom(); }
  const ov = (RD.tickers || {})[idea.ticker] || {};
  /* 防剧透：这道题所在的天还没揭晓时，K 线只画到 ref_date（含）为止，
     「答案」那格整行不出现，exit 金框也不描。同一 ticker 会挂在好几天的
     题里，所以一律按这一题自己的 ref_date 截，而不是按今天揭晓到哪儿。
     52 周高低/当日涨跌全都从截过的窗口现算，未来的价格一个字不漏。 */
  const ideaDay = roomDayOfIdea(idea.id);
  const revealed = !!(ideaDay && S.revealed[ideaDay.day_idx]);
  const chart = revealed ? (idea.chart || [])
    : (idea.chart || []).filter(c => c.date <= idea.ref_date);
  const refBar = chart.find(c => c.date === idea.ref_date);
  const refIdx = refBar ? chart.indexOf(refBar) : -1;
  const prevBar = refIdx > 0 ? chart[refIdx - 1] : null;
  const chg = refBar && prevBar ? refBar.close - prevBar.close : null;
  const chgPct = chg != null && prevBar.close ? chg / prevBar.close : null;
  const hi52 = chart.length ? Math.max(...chart.map(c => c.high)) : null;
  const lo52 = chart.length ? Math.min(...chart.map(c => c.low)) : null;
  const desc = (lang === 'zh' && ov.description_zh) ? ov.description_zh : ov.description;

  $('roomFace').textContent = '📈';
  $('roomFace').classList.remove('bust');
  $('roomDealerName').textContent = idea.ticker;
  $('roomRound').textContent = RT('detailTag');

  $('roomBody').innerHTML = `
    <button class="room-back" data-rback>← ${RT('back')}</button>
    <div class="price-hero">
      <span class="px">${esc(idea.ref_close)}</span>
      <span class="lead" style="margin:0">${RT('asOf')} ${esc(idea.ref_date)}</span>
    </div>
    <div class="chart-wrap" id="chartScroll">
      <div id="chartSvgHost"></div>
      <div class="chart-crosshair" id="chartCrosshair" style="display:none"><div class="ch-line"></div></div>
    </div>
    <div class="mini-stats">
      ${chg != null ? `<div><span>${RT('chgLbl')}</span><b class="${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)} (${sgn(chgPct)})</b></div>` : ''}
      ${refBar ? `<div><span>${RT('openLbl')}</span><b>${refBar.open}</b></div>` : ''}
      ${refBar ? `<div><span>${RT('highLbl')}</span><b>${refBar.high}</b></div>` : ''}
      ${refBar ? `<div><span>${RT('lowLbl')}</span><b>${refBar.low}</b></div>` : ''}
      ${hi52 != null ? `<div><span>${RT('hi52Lbl')}</span><b>${hi52.toFixed(2)}</b></div>` : ''}
      ${lo52 != null ? `<div><span>${RT('lo52Lbl')}</span><b>${lo52.toFixed(2)}</b></div>` : ''}
      <div><span>${RT('marketCapLbl')}</span><b>${fmtCap(ov.market_cap)}</b></div>
      <div><span>${RT('peLbl')}</span><b>${ov.pe_ratio != null && ov.pe_ratio !== '' ? ov.pe_ratio : '—'}</b></div>
      <div><span>${RT('quoteLbl')}</span><b>${(idea.price * 100).toFixed(0)}¢</b></div>
      <div><span>${RT('horizonLbl')}</span><b>${idea.horizon}${RT('daysUnit')}</b></div>
      ${revealed && idea.outcome ? `<div><span>${RT('answer')}</span>
        <b class="${idea.outcome === 'YES' ? 'up' : 'down'}">${esc(idea.outcome)}</b></div>` : ''}
    </div>
    ${ov.sector ? `<p class="lead" style="margin-top:0">${esc(ov.sector)}${ov.industry ? ' · ' + esc(ov.industry) : ''}</p>` : ''}
    ${desc ? `<div class="quote">${esc(desc)}</div>` : ''}
    <p class="q" style="font-size:17px; margin-top:14px">${esc(idea.question)}</p>
    <p class="say">${esc(idea.reason || '')}</p>`;

  mountChart(idea, chart, revealed);

  $('roomBody').querySelectorAll('[data-rback]').forEach(b =>
    b.onclick = () => { roomView = roomDetailFrom; renderRoom(); });
}

/* 圆桌——庄家坐正中心，闲家沿边摆开。信息不再写成一排排字，
   藏在人物后面：鼠标划过/点一下才在下面的信息条里冒出来。
   点庄家才翻开今天的题目——「查看题目」是庄家专属的动作，
   闲家没有这个入口，他们的动作只能靠划过去看。 */
/* 谁在哪天干了什么——桌子右手边那份小字记录的原料。按天分组，
   同一天内按题目顺序列，「答案」字段只在那天已揭晓时才附上，
   没揭晓的天只显示押了哪边，不剧透胜负。 */
function tableActivityRows(S){
  const rows = [];
  for (const day of RD.days){
    if (day.day_idx > S.dayReached) break;
    const revealed = !!S.revealed[day.day_idx];
    const entries = [];
    for (const idea of day.ideas)
      for (const bet of (idea.npc_bets || [])){
        const p = RD.players.find(x => x.id === bet.player_id);
        if (p) entries.push({ p, idea, bet, delta: revealed ? npcBetDelta(bet) : null });
      }
    if (entries.length) rows.push({ day, entries });
  }
  return rows.reverse();
}
function tableActivityHtml(S){
  const rows = tableActivityRows(S);
  if (!rows.length) return `<p class="lead" style="margin:0">${RT('noLogYet')}</p>`;
  return rows.map(({ day, entries }) => `
    <div class="log-day">Day ${day.day_idx}</div>
    ${entries.map(({ p, idea, bet, delta }) => `
      <div class="log-row">${esc(p.emoji)} ${esc(p.name)} ${esc(bet.action)} ${esc(idea.ticker)}
        ${delta != null ? `<b class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '+' : ''}${Math.round(delta)}</b>` : ''}</div>
    `).join('')}
  `).join('');
}

/* 今日题目简略版——庄家挂的题永远是「看涨」（_publish 里 side 恒为 YES），
   所以一律标「做多」，一行一个标的。点开才展开完整题干/thesis/四个按钮
   （roomIdeaCard 原样复用），再点一下收回去。 */
function todayBriefList(day, S){
  if (!day.ideas.length) return `<p class="lead" style="margin:0">${RT('noIdeasToday')}</p>`;
  return day.ideas.map(idea => {
    const b = S.bets[idea.id];
    const tag = !b ? '' : b.action === 'skip' ? RT('skip')
      : RT(b.action === '跟' ? 'follow' : b.action === '反' ? 'fade' : 'duel');
    return `<div class="brief-row ${roomOpenIdeaId === idea.id ? 'active' : ''}" data-ropen="${esc(idea.id)}">
      <span class="dir">${RT('longLabel')}</span><b>${esc(idea.ticker)}</b>
      ${tag ? `<span class="done-tag">${esc(tag)}</span>` : ''}
    </div>`;
  }).join('');
}

/* dlg / bag 两处 tab 头长得一模一样，wiring 抽成一份。
   prefix 同时是 data- 属性名（data-tab / data-btab）和面板 id 前缀（tab- / btab-）。
   返回 show(name) 给需要程序化切页的地方用。 */
function wireTabs(rootSel, prefix){
  const show = name => {
    document.querySelectorAll(rootSel + ' .tabs button').forEach(b =>
      b.setAttribute('aria-selected', b.dataset[prefix] === name));
    document.querySelectorAll(rootSel + ' .tab').forEach(t =>
      t.classList.toggle('on', t.id === prefix + '-' + name));
  };
  document.querySelectorAll(rootSel + ' .tabs button').forEach(btn =>
    btn.onclick = () => show(btn.dataset[prefix]));
  return show;
}
const showDlgTab = wireTabs('#dlg', 'tab');

const stat = (k, v, c = '') =>
  `<div class="stat"><span>${k}</span><b class="${c}">${v}</b></div>`;

function curve(c, start){
  if (!c.length) return '';
  const W = 700, H = 200, vals = c.map(p => p.equity);
  const lo = Math.min(start, ...vals), hi = Math.max(start, ...vals);
  const pad = (hi - lo) * 0.12 || 1;
  const X = i => (i / Math.max(1, c.length - 1)) * W;
  const Y = v => H - ((v - lo + pad) / (hi - lo + pad * 2)) * H;
  const pts = c.map((p, i) => `${X(i).toFixed(1)},${Y(p.equity).toFixed(1)}`).join(' ');
  const col = c[c.length - 1].equity >= start ? 'var(--up)' : 'var(--down)';
  const dd = 1 - Math.min(...vals) / Math.max(start, ...vals);
  // preserveAspectRatio=none：让曲线撑满宽度，否则 viewBox 比例不符会左右留白
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
            style="width:100%;height:200px;background:#fff;box-shadow:inset 0 0 0 3px var(--line)">
      <line x1="0" y1="${Y(start)}" x2="${W}" y2="${Y(start)}"
            stroke="#c9bda4" stroke-width="2" stroke-dasharray="7 6"/>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3"
                vector-effect="non-scaling-stroke"/>
      ${c.map((p, i) => `<rect x="${X(i) - 3}" y="${Y(p.equity) - 3}" width="6" height="6"
            fill="${col}"><title>${esc(p.date)} ${money(p.equity)} · ${esc(p.mood)}</title></rect>`).join('')}
    </svg>
    <p class="note">
      ${T('curveNote', money(start), money(Math.max(...vals)), money(Math.min(...vals)), (dd * 100).toFixed(1))}
    </p>`;
}

/* ================================================================
   下注 —— 实盘等收盘揭晓；历史近 5 天用来模拟对战
   ================================================================ */
let betMode = 'live';          // live | history
let histDay = null;

function practicePnl(){
  return Object.values(P.practice || {}).reduce((m, r) => {
    if (r.ok === true) return m + (r.win - r.stake);
    if (r.ok === false) return m - r.stake;
    return m;
  }, 0);
}
function liveIdeasOf(book){
  const live = book && book.live;
  const asOf = live && live.as_of;
  return ((live && live.ideas) || [])
    .filter(i => !asOf || i.date === asOf)
    .slice()
    .sort((a, b) => {
      const s = (a.session === 'final') - (b.session === 'final');
      if (s) return s;
      return (a.horizon || 1) - (b.horizon || 1);
    });
}
function liveIdeas(){
  return liveIdeasOf(dlgBook());
}
function histDays(){
  const bk = dlgBook();
  return ((bk && bk.history) || []).map(d => d.date);
}
function histIdeas(){
  const bk = dlgBook();
  const days = bk && bk.history || [];
  const d = histDay || (days.length ? days[days.length - 1].date : null);
  const row = days.find(x => x.date === d);
  return (row && row.ideas) || [];
}
/* 找 idea 本体（展示用）。live 原始列表 + 近 5 天 history + agent 级完整 ideas 兜底 ——
   老注单的题不在 history[-5:] 里也能找回来。 */
function findIdea(id){
  for (const book of (BOOKS || [])){
    const hit = ((book.live && book.live.ideas) || [])
      .concat((book.history || []).flatMap(d => d.ideas || []))
      .concat(book.ideas || [])
      .find(i => i.id === id);
    if (hit) return hit;
  }
  return null;
}
/* 结算判定源：顶层 ledger 优先（新 book.js），查不到再退回扫 idea。 */
function resolutionOf(id){
  return LEDGER.get(id) || findIdea(id);
}

function vig(){
  const bk = dlgBook();
  return (bk && bk.stats && bk.stats.vig) || 0;
}
/* 定价参数单源：管线即将在 stats 里导出 prior_strength / prior_price（horizon→先验）。
   优先读它们；老 book.js 没这些字段时回退成原来的写死值（40 / 0.53），行为不变。 */
function priorStrength(bk){
  const v = bk && bk.stats && bk.stats.prior_strength;
  return v != null ? v : 40;
}
function priorPrice(bk, horizon){
  const pp = bk && bk.stats && bk.stats.prior_price;
  const h = horizon || 1;
  if (pp){
    /* JSON 序列化后 dict 的键是字符串数字，数字/字符串两种都认。 */
    const v = pp[h] != null ? pp[h] : pp[String(h)];
    if (v != null) return v;
  }
  return 0.53;
}
function quote(i){
  const p = i.price != null ? i.price : priorPrice(dlgBook(), i.horizon);
  const v = vig();
  return [Math.min(.97, p + v), Math.min(.97, 1 - p + v)];
}

  const stakes = [50, 100, 200].concat(P.buff === 'bold' && betMode === 'live' ? [500] : []);

  el.innerHTML = `

      <div class="wallet">${betMode === 'live'
        ? `${T('chipsLbl')}<b> ${P.chips}</b>`
        : `${T('simPnlLbl')}<b class="${cls(sim)}"> ${sim >= 0 ? '+' : ''}${sim}</b>`}</div>
    </div>

        ${days.map(d => `<button data-day="${esc(d)}" aria-pressed="${d === histDay}">${esc(d.slice(5))}</button>`).join('')}

    <p class="lead" style="margin-top:0">${betMode === 'live'

    ${P.buff && betMode === 'live' ? `<p class="note" style="margin-top:0">${T('buffArmed',
        ITEMS[P.buff].emoji + ' ' + LN(ITEMS[P.buff]))}</p>` : ''}
    ${ideas.length ? ideas.map(i => betCard(i, betMode === 'live')).join('')
                   : `<p>${betMode === 'live' ? T('noIdeasLive') : T('noIdeasHist')}</p>`}
    <div class="stakes" style="margin-top:4px">${T('stakeLbl')}
      ${stakes.map(v =>
        `<button data-stake="${v}" aria-pressed="${v === stake}">${v}</button>`).join('')}
      ${betMode === 'history'
        ? `<button onclick="resetPractice()" style="margin-left:auto">${T('clearPractice')}</button>`
        : `<button onclick="openBag()" style="margin-left:auto">${T('openBagBtn')}</button>`}
    </div>
    ${calibTable()}
    <p class="note">
      ${T('baseNote')}<br>
      ${vig() ? T('vigNote', (vig() * 100).toFixed(0)) : T('vigZero')}<br>
      ${gapNote()}
    </p>`;

  el.querySelectorAll('[data-mode]').forEach(b =>
    b.onclick = () => { betMode = b.dataset.mode; renderBets(); });
  el.querySelectorAll('[data-day]').forEach(b =>

  el.querySelectorAll('[data-stake]').forEach(b =>

  el.querySelectorAll('[data-bet]').forEach(b =>
    b.onclick = () => place(b.dataset.bet, b.dataset.side, betMode === 'live'));

function horizonTag(i){
  const n = i.horizon || 1;
  const left = Math.max(0, n - (i.elapsed || 0));
  const when = T('hzDays', n);
  if (i.status === 'resolved') return `${when} · ${T('hzDue')}`;
  return n <= 1 ? when : `${when} · ${T('hzLeft', left)}`;
}
function sessionTag(i){
  return i.session === 'morning' ? T('sessMorning') : i.session === 'final' ? T('sessFinal') : '';
}

function calibTable(){
  const rows = dlgBook().calibration || [];
  if (!rows.length) return '';
  return `<p class="lead">${T('calibLead')}</p>
    <table><thead><tr>
      <th>${T('thBin')}</th><th>${T('thN')}</th><th>${T('thWins')}</th>
      <th>${T('thRealized')}</th><th>${T('thPriceNow')}</th>
    </tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td class="txt">${esc(r.label)}</td><td>${r.n}</td><td>${r.wins}</td>
        <td>${r.realized == null ? '—' : (r.realized * 100).toFixed(0) + '%'}</td>
        <td><b>${(r.price * 100).toFixed(0)}¢</b></td></tr>`).join('')}
    </tbody></table>
    <p class="note" style="margin-top:6px">${T('calibNote', priorStrength(dlgBook()))}</p>`;
}

function gapNote(){
  const s = dlgBook().stats;
  if (s.idea_quoted == null || s.idea_hit_rate == null) return '';
  const gap = s.idea_quoted - s.idea_hit_rate;
  const se = Math.sqrt(0.25 / s.idea_total);
  const sig = Math.abs(s.idea_hit_rate - 0.5) / se;
  return T('gapNote', s.idea_total, (s.idea_quoted * 100).toFixed(0),
           (s.idea_hit_rate * 100).toFixed(0), Math.abs(gap * 100).toFixed(0), gap > 0, sig);
}

/** 封盘判定：bet_cutoff 存在且已过就封。旧数据没这个字段，永远返回 false。 */
function isSealed(i){
  if (!i || !i.bet_cutoff) return false;
  const cut = Date.parse(i.bet_cutoff);
  return !isNaN(cut) && Date.now() > cut;
}

function crowdLine(i){
  const c = i.crowd;
  if (!c || !c.n) return '';
  const who = (c.bettors || []).map(b =>
    `${esc(b.emoji)}${b.side === 'YES' ? (lang === 'en' ? 'follow' : '跟') : (lang === 'en' ? 'fade' : '反')}`).join(' ');
  const label = lang === 'en'
    ? `🎲 ${c.n} NPC players bet · long ${c.yes} : short ${c.no}`
    : `🎲 ${c.n} 个 NPC 玩家下了注 · 多 ${c.yes} : 空 ${c.no}`;
  return `<div style="font-size:12px;opacity:.75;margin:2px 0 6px">${label}${who ? ' · ' + who : ''}</div>`;
}

function betCard(i, isLive){
  const book = isLive ? P.bets : (P.practice || {});
  const done = book[i.id];
  const [pYes, pNo] = quote(i);
  const payout = p => (1 / p).toFixed(2);
  const resolved = i.status === 'resolved' && i.outcome;
  const sealed = isLive && !done && isSealed(i);
  const sideTxt = s => s === 'YES' ? T('sideFollow') : T('sideFade');
  let res = '';
  if (done && done.pending){
    res = `<div class="result">${T('placedPending', sideTxt(done.side), done.stake, i.horizon || 1)}</div>`;
  } else if (done && done.refunded){
    res = `<div class="result">${T('refundedCard', done.stake)}</div>`;
  } else if (done && (done.ok === true || done.ok === false)){
    const won = done.ok;
    res = `<div class="result ${won ? 'win' : 'lose'}">
      ${T('resultHead', esc(i.ticker), esc(i.ref_date), esc(i.ref_close), esc(i.exit_date || ''),
          esc(i.exit_close || '—'), sgn(i.move_pct), esc(i.outcome))}<br>
      ${T('resultYou', sideTxt(done.side), done.stake, !!done.practice, won,
          won ? done.win - done.stake : done.stake)}
      ${done.practice ? T('notCounted') : ''}${done.buff
        ? T('buffApplied', ITEMS[done.buff].emoji + ' ' + LN(ITEMS[done.buff])) : ''}。
    </div>`;
  } else if (sealed){
    res = `<div class="result">${T('closedBook')}</div>`;
  } else if (!isLive && !resolved){
    res = `<div class="result">${T('histNotDue')}</div>`;
  }

  const locked = !!done || sealed || (!isLive && !resolved);
  return `<div class="bet">
    <div class="q">${esc(fld(i, 'question'))}</div>
    <div class="say">${T('heSays', esc(fld(i, 'reason')))} <span style="opacity:.7">（${esc(fld(i, 'mood'))}${sessionTag(i) ? ' · ' + sessionTag(i) : ''} · ${horizonTag(i)}）</span>
      <br><span style="opacity:.7">${T('convictionLine', (i.conviction * 100).toFixed(0), i.n_prior)}</span></div>
    ${crowdLine(i)}
    <div class="odds">
      <button data-bet="${esc(i.id)}" data-side="YES" ${locked ? 'disabled' : ''}>
        ${T('betYes')}<b>${payout(pYes)}×</b>
        <i>${T('quoteWin', (pYes * 100).toFixed(0), stake, Math.round(stake / pYes - stake))}</i></button>
      <button data-bet="${esc(i.id)}" data-side="NO" ${locked ? 'disabled' : ''}>
        ${T('betNo')}<b>${payout(pNo)}×</b>
        <i>${T('quoteWin', (pNo * 100).toFixed(0), stake, Math.round(stake / pNo - stake))}</i></button>
    </div>
    ${res}</div>`;
}

function place(id, side, isLive){
  if (isLive) placeLive(id, side);
  else placePractice(id, side);
}

function placeLive(id, side){
  if (P.bets[id]) return;
  const i = findIdea(id);
  if (!i) return;
  if (isSealed(i)){ renderBets(); return; }        // 已封盘，拒单（旧数据没 cutoff，不受影响）
  if (P.chips < stake){ alert(T('alertNoChips')); return; }
  const [pYes, pNo] = quote(i);
  const buff = P.buff;
  const bk = dlgBook();
  const win = Math.round(stake / (side === 'YES' ? pYes : pNo));
  P.seq = (P.seq || 0) + 1;
  /* 快照题面：就算这个 idea 以后从 book.js 里消失，背包也说得清这注押的是什么。 */
  const rec = { side, stake, win, buff, seq: P.seq, at: Date.now(),
                ticker: i.ticker, date: i.date, price: i.price, horizon: i.horizon,
                question: i.question, q_en: i.q_en || null,
                agent: (bk && bk.agent && bk.agent.name) || null,
                practice: false, pending: true, ok: null };
  /* live 盘恒为 open（管线只把当天未揭晓的题放进 live.ideas），下注一律挂起扣本金。
     结算只走 settleLiveBets 这一个入口 —— 万一答案其实已经在 ledger 里，它也会当场入账。 */
  P.chips -= stake;
  if (buff) P.buff = null;
  P.bets[id] = rec;
  settleLiveBets();
  saveP();
  renderBets();
}

/** 历史盘：只记对错，绝不改 P.chips / P.peak / 称号。 */
function placePractice(id, side){
  P.practice = P.practice || {};
  if (P.practice[id]) return;
  const i = findIdea(id);
  if (!i || i.status !== 'resolved' || !i.outcome) return;
  const [pYes, pNo] = quote(i);
  const bk = dlgBook();
  const win = Math.round(stake / (side === 'YES' ? pYes : pNo));
  P.practice[id] = {
    side, stake, win, ok: side === outUp(i), pending: false, practice: true,
    ticker: i.ticker, date: i.date, price: i.price, horizon: i.horizon,
    question: i.question, q_en: i.q_en || null,
    agent: (bk && bk.agent && bk.agent.name) || null, at: Date.now(),
  };
  saveP();
  renderBets();
}

function resetPractice(){
  P.practice = {};
  saveP();
  renderBets();
}

/** 实盘揭晓后入账。判定优先走顶层 ledger（新 book.js），没有再回退扫 idea。 */
function settleLiveBets(){
  let changed = false;
  for (const [id, rec] of Object.entries(P.bets || {})){
    if (!rec.pending) continue;
    const r = resolutionOf(id);
    if (!r || r.status !== 'resolved' || !r.outcome) continue;
    rec.ok = rec.side === outUp(r);   // ledger 是小写 yes/no，旧 idea 是大写，拉平再比
    rec.pending = false;
    let win = rec.win;
    if (rec.buff === 'rumor' && rec.ok) win = Math.round(win * 1.25);
    rec.win = win;
    if (rec.ok) P.chips += win;       // 本金已扣，赢了把派彩加回来
    P.peak = Math.max(P.peak, P.chips);
    changed = true;
  }
  if (changed) saveP();
}

/** 最后兜底：>30 天还 pending（idea/ledger 都给不出答案）的注退回本金，防筹码黑洞。 */
function refundBet(id){
  const b = P.bets[id];
  if (!b || !b.pending) return;
  b.pending = false;
  b.ok = null;
  b.refunded = true;
  P.chips += b.stake;
  P.peak = Math.max(P.peak, P.chips);
  saveP();
  renderBag();
}

function devAddChips(n){ P.chips += n; if (P.chips > (P.peak || 0)) P.peak = P.chips; saveP(); renderBag(); }

function equipTitle(id){ P.title = id; saveP(); renderBag(); }
function equipSkin(id){ P.skin = id; saveP(); renderBag(); }
function buySkin(id){
  const sk = SKINS[id];
  if (P.chips < sk.cost) return;
  P.chips -= sk.cost; P.skins.push(id); P.skin = id; saveP(); renderBag();
}
function buyItem(k){
  const it = ITEMS[k];
  if (P.chips < it.cost) return;
  P.chips -= it.cost; P.items[k] = (P.items[k] || 0) + 1; saveP(); renderBag();
}
function useItem(k){
  if ((P.items[k] || 0) <= 0) return;
  P.items[k] -= 1; P.buff = k; saveP(); renderBag();
}

/** 冷静一下：撤销最近一注，退回本金。 */
function undoLastBet(){
  /* 已退款的注本金早回来了，再冲销一次就是白送钱 —— 跳过。 */
  const log = Object.entries(P.bets).filter(([, b]) => !b.refunded)
    .sort((a, b) => (b[1].seq || 0) - (a[1].seq || 0));
  if (!log.length){ alert(T('alertNoBets')); return; }
  const [id, b] = log[0];
  P.chips -= b.ok ? b.win - b.stake : -b.stake;   // 反向冲销
  delete P.bets[id];
  P.items.calm = (P.items.calm || 0) - 1;
  saveP(); renderBag(); renderBets();
}

/* ================================================================
   新手引导（coach-marks）+「?」规则卡
   纯展示层：不碰结算、不碰 P 的任何字段。教程状态单独存
   fledge.tut.room.v1，跟玩家存档（fledge.player.v1）分开，
   devReset 也不会误清它。文案全部走 I18N / ROOM_I18N，数字全部
   从 RD.config 和 roomYou/DealerBankruptLine 现算，不写死。
   ================================================================ */
const TUT_KEY = 'fledge.tut.room.v1';
let tutSteps = [], tutIdx = -1, tutPrevView = null;
function tutActive(){ return tutIdx >= 0; }

/* 教程和规则卡共用的一份数字：例子价取本局第一道题的真实报价（没有就 60¢），
   注码/上限/破产线全部从 config 和结算同源的函数里现算。 */
function roomTutNums(){
  const cfg = RD.config;
  let firstIdea = null;
  for (const d of RD.days){ if (d.ideas && d.ideas.length){ firstIdea = d.ideas[0]; break; } }
  const p = firstIdea && firstIdea.price != null ? firstIdea.price : 0.6;
  const pC = Math.round(p * 100);
  const fS = cfg.player_min_stake, dS = cfg.dealer_min_stake;
  return {
    pC, fadeC: 100 - pC, fS, dS, cap: cfg.duel_cap,
    fW: Math.round(fS / p - fS),          // 跟：押最低注赢多少（stake/price − stake）
    aW: Math.round(fS / (1 - p) - fS),    // 反：同一口径
    dW: Math.round(dS / (1 - p) - dS),    // 对赌：按对赌最低注算
    pin: cfg.player_initial_cash, dIn: RD.dealer.start_cash,
    youLine: Math.round(roomYouBankruptLine()),
    dealerLine: Math.round(roomDealerBankruptLine()),
    linePct: Math.round((1 - cfg.bankrupt_pct) * 100),
    days: RD.days.length,
  };
}

/* 每一步：view = 需要的房间视图（null 不切），sel = 高亮目标选择器。
   目标不存在（当天没题 / 局已结束）就自动跳过该步。文案是闭包，
   每次展示现取 RT——中途切语言直接生效。 */
function buildTutSteps(){
  const N = roomTutNums();
  const th = () => esc((lang === 'en' ? RD.dealer.theme_en : RD.dealer.theme) || RD.dealer.theme || '');
  return [
    { view: 'table', sel: '#roomBody .table-wrap',
      t: () => RT('tut1t'),
      b: () => RT('tut1b', esc(RD.dealer.emoji || '🎩'), esc(RD.dealer.name), th(), N.days) },
    { view: 'questions', sel: '#roomBody .room-bet',
      t: () => RT('tut2t'), b: () => RT('tut2b', N.pC) },
    { view: 'questions', sel: '#roomBody .room-odds button[data-raction="跟"]',
      t: () => RT('tut3t'), b: () => RT('tut3b', N.pC, N.fS, N.fW) },
    { view: 'questions', sel: '#roomBody .room-odds button[data-raction="反"]',
      t: () => RT('tut4t'), b: () => RT('tut4b', N.fadeC, N.fS, N.aW) },
    { view: 'questions', sel: '#roomBody .room-odds button[data-raction="对赌"]',
      t: () => RT('tut5t'), b: () => RT('tut5b', N.dS, N.cap) },
    { view: 'questions', sel: '#roomBody .room-odds button[data-raction="skip"]',
      t: () => RT('tut6t'), b: () => RT('tut6b') },
    { view: 'table', sel: '#roomBody .seat.you',
      t: () => RT('tut7t'), b: () => RT('tut7b', money(N.pin), N.fS, N.dS, money(N.youLine)) },
    { view: 'table', sel: '#roomBody .seat.dealer',
      t: () => RT('tut8t'), b: () => RT('tut8b', money(N.dIn), money(N.dealerLine), N.days) },
    { view: null, sel: '#roomHelpBtn',
      t: () => RT('tut9t'), b: () => RT('tut9b') },
  ];
}

function maybeStartRoomTut(){
  if (!RD || localStorage.getItem(TUT_KEY)) return;
  startRoomTut();
}
function startRoomTut(){
  if (!RD || !roomDlgOpen()) return;
  tutPrevView = roomView;      // 结束后把玩家送回他本来在的视图
  tutSteps = buildTutSteps();
  $('coachOverlay').classList.add('on');
  tutShow(0);
}
function tutShow(i){
  if (!RD || !roomDlgOpen() || i >= tutSteps.length) return tutEnd();
  const st = tutSteps[i];
  tutIdx = i;
  if (st.view && roomView !== st.view){ roomView = st.view; renderRoom(); }
  const target = document.querySelector(st.sel);
  if (!target) return tutShow(i + 1);      // 目标不存在，这一步自动跳过
  try { target.scrollIntoView({ block: 'center' }); } catch (err) { /* 旧引擎不认参数也无妨 */ }
  const card = $('coachCard');
  const last = i === tutSteps.length - 1;
  card.innerHTML = `
    <div class="stepn">${i + 1} / ${tutSteps.length}</div>
    <h4>${st.t()}</h4>
    <div class="coach-b">${st.b()}</div>
    <div class="btns">
      <button type="button" id="coachSkip">${RT('tutSkip')}</button>
      <button type="button" id="coachNext" class="primary">${last ? RT('tutDone') : RT('tutNext')}</button>
    </div>`;
  $('coachSkip').onclick = () => tutEnd();
  $('coachNext').onclick = () => { if (tutActive()) tutShow(tutIdx + 1); };
  tutPlace();
}
/* 描边框 + 说明卡定位。resize 时重算；教程期间遮罩拦截滚动来源，
   位置只会因窗口变化而变。 */
function tutPlace(){
  if (!tutActive()) return;
  const st = tutSteps[tutIdx];
  const target = document.querySelector(st.sel);
  if (!target) return;
  const r = target.getBoundingClientRect();
  const pad = 6;
  const ring = $('coachRing'), card = $('coachCard');
  ring.style.left = (r.left - pad) + 'px';
  ring.style.top = (r.top - pad) + 'px';
  ring.style.width = (r.width + pad * 2) + 'px';
  ring.style.height = (r.height + pad * 2) + 'px';
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let cl = Math.max(12, Math.min(r.left, innerWidth - cw - 12));
  let ct = r.bottom + pad + 12;                          // 先试目标下方
  if (ct + ch > innerHeight - 12) ct = r.top - pad - ch - 12;   // 塞不下就上方
  if (ct < 12){                                          // 上下都不行：摆到旁边，纵向夹进可视区
    ct = Math.max(12, Math.min(innerHeight - ch - 12, r.top));
    cl = (r.right + pad + 12 + cw <= innerWidth) ? r.right + pad + 12
       : Math.max(12, r.left - pad - cw - 12);
  }
  card.style.left = cl + 'px';
  card.style.top = ct + 'px';
}
/* 跳过和完成一视同仁：写 key 之后不再自动弹（规则卡里可重播）。 */
function tutEnd(){
  if (!tutActive()) return;
  localStorage.setItem(TUT_KEY, '1');
  tutIdx = -1; tutSteps = [];
  $('coachOverlay').classList.remove('on');
  if (roomDlgOpen() && RD && tutPrevView){ roomView = tutPrevView; renderRoom(); }
  tutPrevView = null;
}
addEventListener('resize', () => { if (tutActive()) tutPlace(); });

/* ----------「?」帮助 / 规则卡 ---------- */
let helpKind = 'plaza';
function helpDlgOn(){ const el = document.getElementById('helpDlg'); return !!el && el.classList.contains('on'); }
function openHelp(kind){ helpKind = kind; renderHelp(); $('helpDlg').classList.add('on'); }
function closeHelp(){ const el = document.getElementById('helpDlg'); if (el) el.classList.remove('on'); }

/* 广场版例子：取第一个摊主当前第一道题的真实报价（含抽水，跟按钮同口径），
   没有 live 题就退回 60¢；注码用默认档 100。 */
function plazaHelpNums(){
  let c = 60;
  const bk = BOOKS && BOOKS[0];
  const i = bk && liveIdeasOf(bk)[0];
  if (i && i.price != null){
    const v = (bk.stats && bk.stats.vig) || 0;
    c = Math.round(Math.min(0.97, i.price + v) * 100);
  }
  const s = 100;
  return { c, s, w: Math.round(s / (c / 100) - s) };
}

function helpPlazaHtml(){
  const ex = plazaHelpNums();
  return `
    <div class="head">
      <div class="face">❓</div>
      <div class="who"><h1>${T('helpTitle')}</h1><div class="sub">${T('helpSub')}</div></div>
      <button class="close" onclick="closeHelp()">✕</button>
    </div>
    <div class="body">
      <div class="rule-row">${T('help1')}</div>
      <div class="rule-row">${T('help2', ex.c, ex.s, ex.w)}</div>
      <div class="rule-row">${T('help3')}</div>
    </div>`;
}
function helpRoomHtml(){
  const N = roomTutNums();
  return `
    <div class="head">
      <div class="face">❓</div>
      <div class="who"><h1>${RT('rulesTitle')}</h1><div class="sub">${RT('rulesSub')}</div></div>
      <button class="close" onclick="closeHelp()">✕</button>
    </div>
    <div class="body">
      <p class="lead" style="margin-top:0">${RT('rulesActions')}</p>
      <div class="rule-row">${RT('ruleFollow', N.pC, N.fS, N.fW)}</div>
      <div class="rule-row">${RT('ruleFade', N.fadeC, N.fS, N.aW)}</div>
      <div class="rule-row">${RT('ruleDuel', N.dS, N.cap, N.dS, N.dW)}</div>
      <div class="rule-row">${RT('ruleSkip')}</div>
      <p class="lead">${RT('rulesMoney')}</p>
      <div class="rule-row">${RT('ruleMoney', money(N.pin), money(N.dIn), N.fS, N.dS, N.cap,
        N.linePct, money(N.youLine), money(N.dealerLine))}</div>
      <p class="lead">${RT('rulesReveal')}</p>
      <div class="rule-row">${RT('ruleReveal', esc(RT('nextDay')), N.days)}</div>
      <button class="room-advance" id="tutReplayBtn" style="margin-top:14px">${RT('replayTut')}</button>
    </div>`;
}
function renderHelp(){
  const panel = document.getElementById('helpPanel');
  if (!panel) return;
  panel.innerHTML = helpKind === 'room' && RD ? helpRoomHtml() : helpPlazaHtml();
  const rp = document.getElementById('tutReplayBtn');
  if (rp) rp.onclick = () => {
    localStorage.removeItem(TUT_KEY);
    closeHelp();
    if (roomDlgOpen()) startRoomTut(); else openRoom();   // openRoom 自己会看 key 决定起引导
  };
}
{ /* 顶层 wiring——此处 $ 已定义，但仍按缺 book.js 被整页替换的情形容错 */
  const hd = document.getElementById('helpDlg');
  if (hd) hd.addEventListener('click', e => { if (e.target.id === 'helpDlg') closeHelp(); });
  const pb = document.getElementById('plazaHelpBtn');
  if (pb) pb.onclick = () => openHelp('plaza');
  const rb = document.getElementById('roomHelpBtn');
  if (rb) rb.onclick = () => openHelp('room');
}
</script>
