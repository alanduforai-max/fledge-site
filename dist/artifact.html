<style>/* Fledge Trading Lab — tokens. Imported from the claude.ai/design project
   (fledge-quant-lab design system). Light is the default reading theme; dark is
   the explicit toggle. The light ink ramp stays constant: the drafting plates
   keep light paper in both themes. */
:root{
  /* ink ramp — cool slate */
  --ink-900:#0A1120;--ink-800:#101C37;--ink-700:#22304C;--ink-600:#3D4D6B;
  --ink-500:#5A6A85;--ink-400:#7B8AA0;--ink-300:#9DA9B7;--ink-200:#BCC4CE;
  --ink-100:#D6DCE1;--ink-050:#E4E8EB;--paper:#F7F9FA;--paper-pure:#FFFFFF;

  /* accent ramp — blue */
  --blue-700:#101C37;--blue-600:#22335C;--blue-500:#3D4D6B;
  --blue-400:#5B7096;--blue-300:#8DA0C2;--blue-100:#C3CEE0;--blue-050:#E7ECF4;

  /* dark ground */
  --night-900:#0A1120;--night-850:#0E1729;--night-800:#131E33;
  --night-700:#1C2942;--night-600:#263452;--night-500:#33425F;

  /* ── semantic (light default) ─────────────────────────────── */
  --bg-page:var(--paper);
  --bg-sunk:var(--ink-050);
  --surface-card:var(--paper-pure);
  --surface-raised:var(--paper-pure);
  --surface-inset:var(--ink-050);
  --surface-accent:var(--blue-050);

  --text-display:var(--ink-900);
  --text-body:var(--ink-800);
  --text-secondary:var(--ink-600);
  --text-muted:var(--ink-500);
  --text-faint:var(--ink-400);
  --text-accent:var(--blue-500);

  --line-hairline:var(--ink-200);
  --line-rule:var(--ink-300);
  --line-strong:var(--ink-800);
  --line-accent:var(--blue-500);

  --accent:var(--blue-500);
  --accent-hover:var(--blue-600);
  --accent-press:var(--blue-700);
  --accent-quiet:var(--blue-100);

  --focus-ring:var(--blue-500);
  --selection-bg:var(--blue-100);

  --btn-hover-bg:var(--ink-700);

  --shadow-lift:0 1px 2px rgba(22,21,15,.05);
  --shadow-float:0 8px 28px -10px rgba(22,21,15,.16),0 1px 3px rgba(22,21,15,.05);

  /* charts — ordinal slate ramp, A dim → C emphatic (validated per surface) */
  --chart-a:#8DA0C2;
  --chart-b:#5B7096;
  --chart-c:#22335C;
  --chart-grid:var(--ink-050);
  --chart-grid-strong:var(--ink-200);
  --chart-tick:var(--ink-400);
  --chart-axis:var(--ink-500);

  /* type — the site overrides the DS families with IBM Plex */
  --font-display:"IBM Plex Sans","Helvetica Neue",Helvetica,sans-serif;
  --font-text:"IBM Plex Sans","Helvetica Neue",Helvetica,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

  --size-display-1:clamp(2.75rem,1.6rem + 4.2vw,5.25rem);
  --size-display-2:clamp(2.25rem,1.5rem + 2.6vw,3.5rem);
  --size-display-3:clamp(1.75rem,1.35rem + 1.4vw,2.375rem);
  --size-display-4:1.375rem;
  --size-lead:clamp(1.0625rem,1rem + 0.35vw,1.25rem);
  --size-body:1rem;
  --size-body-sm:0.9375rem;
  --size-caption:0.8125rem;
  --size-label:0.75rem;
  --size-mono:0.8125rem;
  --size-mono-sm:0.6875rem;

  --leading-display:1.06;
  --leading-title:1.14;
  --leading-snug:1.35;
  --leading-body:1.62;

  --track-display:-0.035em;
  --track-title:-0.024em;
  --track-label:0.13em;
  --track-mono:0.01em;

  --weight-display:300;
  --weight-display-light:300;
  --weight-medium:500;

  --measure-prose:64ch;
  --measure-lead:46ch;
  --measure-display:22ch;

  /* space */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;
  --space-20:80px;--space-24:96px;

  --gutter-lg:48px;
  --page-max:1200px;
  --content-max:760px;
  --section-y:clamp(80px,10vw,192px);
  --section-y-tight:clamp(56px,6vw,96px);

  --radius-1:2px;
  --border-hair:1px;
  --border-strong:1.5px;

  /* motion */
  --ease-standard:cubic-bezier(.22,.61,.36,1);
  --ease-out-quiet:cubic-bezier(.16,1,.3,1);
  --dur-fast:140ms;
  --dur-base:220ms;
}
:root[data-theme="dark"]{
  --bg-page:var(--night-900);
  --bg-sunk:var(--night-850);
  --surface-card:var(--night-850);
  --surface-raised:var(--night-800);
  --surface-inset:var(--night-800);
  --surface-accent:#152340;

  --text-display:#EDF1F4;
  --text-body:#DCE2E8;
  --text-secondary:#A3AEBC;
  --text-muted:#7B8AA0;
  --text-faint:#5C6B82;
  --text-accent:#8DA0C2;

  --line-hairline:var(--night-700);
  --line-rule:var(--night-600);
  --line-strong:#B4BECB;
  --line-accent:var(--blue-300);

  --accent:var(--blue-300);
  --accent-hover:#B0BFD8;
  --accent-press:var(--blue-400);
  --accent-quiet:#1E2C48;

  --focus-ring:var(--blue-300);
  --selection-bg:#22335C;

  --btn-hover-bg:var(--ink-100);

  --shadow-lift:0 1px 2px rgba(0,0,0,.5);
  --shadow-float:0 8px 28px -10px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.4);

  --chart-a:#5B7096;
  --chart-b:#8DA0C2;
  --chart-c:#D3DEF0;
  --chart-grid:var(--night-700);
  --chart-grid-strong:var(--night-500);
  --chart-tick:#5C6B82;
  --chart-axis:#7B8AA0;
}
@media (prefers-reduced-motion:reduce){
  :root{--dur-fast:0ms;--dur-base:0ms}
}

/* Fledge Trading Lab — component styles. Faithful to the design project:
   rules not shadows, hairlines, spent whitespace, monochrome slate. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-text);font-size:var(--size-body);line-height:var(--leading-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
p{margin:0;text-wrap:pretty}
a{color:var(--text-accent);text-decoration:none;transition:color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
a:hover{color:var(--accent-hover)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:1.5px solid var(--focus-ring);outline-offset:2px}
::selection{background:var(--selection-bg)}
img,svg,canvas{display:block;max-width:100%}
table{border-collapse:collapse}
code,pre{font-family:var(--font-mono);font-size:var(--size-mono);letter-spacing:var(--track-mono)}

.shell{background:var(--bg-page);min-height:100vh;font-family:var(--font-text)}
.container{max-width:var(--page-max);margin:0 auto;padding:0 var(--gutter-lg)}
@media (max-width:720px){.container{padding:0 24px}}

/* header */
.site-header{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg-page) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-hairline)}
.site-header .bar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-8)}
.wordmark{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap;font-family:var(--font-display);font-size:19px;line-height:1;color:var(--text-display)}
.wordmark b{font-weight:500;letter-spacing:-0.02em}
.wordmark .bar-sep{display:inline-block;width:1px;align-self:stretch;background:currentColor;opacity:.28;transform:translateY(.12em)}
.wordmark i{font-style:italic;font-weight:300;letter-spacing:-0.005em;opacity:.9}
.wordmark.sm{font-size:17px}
.site-nav{display:flex;align-items:center;gap:var(--space-8)}
.site-nav a{font-size:var(--size-body-sm);padding-bottom:2px;border-bottom:1px solid transparent;color:var(--text-muted)}
.site-nav a:hover{color:var(--text-display)}
.site-nav a.active{color:var(--text-display);border-bottom-color:var(--line-strong)}
@media (max-width:720px){.site-nav{gap:var(--space-5)}}
.nav-group{display:flex;align-items:center;gap:var(--space-6)}
.nav-sep{width:1px;height:14px;background:var(--line-hairline)}
.theme-toggle{display:inline-flex;align-items:center;gap:var(--space-2)}
.theme-toggle button{background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-text);font-size:var(--size-label);font-weight:var(--weight-medium);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-faint);transition:color var(--dur-fast) var(--ease-standard)}
.theme-toggle button:hover{color:var(--text-secondary)}
.theme-toggle button[aria-pressed="true"]{color:var(--text-display)}

/* core components (from the design system bundle) */
.eyebrow{display:flex;align-items:baseline;gap:var(--space-3);font-size:var(--size-label);font-weight:var(--weight-medium);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-muted)}
.rule{border:0;border-top:var(--border-hair) solid var(--line-hairline);margin:0}

    bodyHtml: `
<h2>The question</h2>
<p>A language model asked to make a directional call — long or short, act or stand aside — does not give the same answer every time. Decoding is stochastic; the answer is a draw, not a verdict. The standard remedy is to ask K times and take the majority. On reasoning benchmarks this works famously well: self-consistency added 17.9 points on GSM8K&nbsp;[3], and sampling-and-voting scales small models past larger ones&nbsp;[2]. So it is tempting to treat K as an accuracy dial: too noisy, sample more.</p>
<p>A trading decision is a different regime. It is a two-way call, close to the coin-flip line, with no verifier available before the outcome arrives. This note works through what majority voting can and cannot do there, using a model small enough to solve exactly.</p>

<h2>A minimal model</h2>
<p>Each decision <em>i</em> has a latent per-sample competence <span class="fql-mono">p<sub>i</sub></span> — the probability that one sample calls it correctly. We draw K samples independently (conditional on the decision) and take the majority, K odd. Two numbers describe the whole system:</p>
<ol>
<li>At K = 1, expected accuracy is <strong>E[p]</strong> — average competence across decisions.</li>
<li>As K → ∞, the vote converges on each decision to the model's modal answer, so accuracy converges to <strong>P(p &gt; ½)</strong> — the fraction of decisions the model gets right <em>more often than not</em>.</li>
</ol>
<p>Everything voting can ever do to accuracy lives in the gap between those two numbers. Where p<sub>i</sub> &gt; ½, voting amplifies to certainty; where p<sub>i</sub> &lt; ½, it amplifies the error to certainty just as efficiently — Condorcet's jury theorem cuts both ways&nbsp;[6]. Chen et&nbsp;al. derive precisely this decomposition for LLM call-scaling and observe the non-monotone consequences on real tasks&nbsp;[1]. Note the model is generous to voting: samples from one model share its systematic errors, and correlated juries do strictly worse than this independent one&nbsp;[6,7].</p>

<h2>Three worlds</h2>
<p>Same machinery in all three; the only difference is where the mass of p sits relative to ½. World A is the Condorcet ideal usually invoked to justify voting. World B mixes decisions the model is mildly right about with a tail it is mildly wrong about. World C is a system that is excellent on most decisions and slightly below chance on a hard minority — arguably the realistic shape for a competent decision system, since easy calls are abundant and the residual is hard precisely because the model has no edge there.</p>
<div class="spec-table"><table>
<thead><tr><th>World</th><th>Composition</th><th>E[p] (K=1)</th><th>P(p&gt;½) (K→∞)</th></tr></thead>
<tbody>
<tr><td>A · uniform edge</td><td>every decision p = 0.55</td><td>0.550</td><td>1.000</td></tr>
<tr><td>B · mixed</td><td>70% at p = 0.62 · 30% at p = 0.45</td><td>0.569</td><td>0.700</td></tr>
<tr><td>C · hard tail</td><td>60% at p = 0.85 · 40% at p = 0.45</td><td>0.690</td><td>0.600</td></tr>
</tbody>
</table></div>
<figure class="fig">

  <div class="data-table" data-table="acc"></div>
</figure>
<p>The gap between worlds is not subtle. In C, the vote converts a 69%-accurate sampler into a 60%-accurate committee, because 40% of its decisions sit just below the coin-flip line and voting faithfully hardens each of them into a confident mistake. No benchmark that scores one sample per prompt would see the difference between A and C coming.</p>

<h2>What K reliably buys: repeatability</h2>
<p>Stability is a different quantity: run the identical book twice and count decisions that flip. At K&nbsp;=&nbsp;1 in world A, <strong>49.5% of decisions flip between two identical reruns</strong> — half the book is a lottery ticket. Voting drives this down, and unlike the accuracy effect it never has the wrong sign.</p>
<figure class="fig">
  <div class="fig-head"><span class="fig-title">Decision flips between two identical reruns</span><span class="fig-num">Fig. 2</span></div>
  <div class="chart-wrap" data-chart="flip"></div>
  <figcaption>Probability a decision's final call differs between two independent K-vote runs. World C stabilizes fast (0.35 → 0.20 by K&nbsp;=&nbsp;9) because most of its decisions are far from ½. World A barely improves (0.495 → 0.38 at K&nbsp;=&nbsp;41): near the coin-flip line, even stability is expensive.</figcaption>
  <div class="data-table" data-table="flip"></div>
</figure>
<p>Two readings. First, the stability gain is real and immediate — this is the honest reason to sample more than once, and it also makes evaluation cheaper: a stable system needs fewer runs to measure. Second, K stabilizes what the model already believes; it does not settle what the model is genuinely unsure of. The decisions that stay unstable at K&nbsp;=&nbsp;9 are exactly the ones where the vote, if forced, hardens noise.</p>

<h2>Payoff weighting can flip the sign</h2>
<p>Accuracy counts decisions equally. A book does not: it earns the move. Add one assumption to worlds B and C — the hard decisions carry moves twice the size of the easy ones, because the events a model is worst at calling are the surprises, and surprises move most.</p>
<figure class="fig">
  <div class="fig-head"><span class="fig-title">Expected P&amp;L per decision, move-weighted</span><span class="fig-num">Fig. 3</span></div>
  <div class="chart-wrap" data-chart="pnl"></div>
  <figcaption>Expected payoff per decision (units of the small move) for a fixed-size directional bet, when hard decisions move 2 units and easy ones 1. World C peaks at K&nbsp;=&nbsp;5 and decays; its K→∞ limit is <strong>−0.20 per decision — negative, while its limiting accuracy is 60%, comfortably above chance</strong>. Wrongness concentrated in the big-move decisions costs more than abundant small-move rightness earns.</figcaption>
  <div class="data-table" data-table="pnl"></div>
</figure>
<p>The decay is slow — at K&nbsp;=&nbsp;41 world C still shows +0.21 — which is the dangerous part. A live sample of a few hundred decisions would read as healthy long after the vote has begun quietly rotating the book toward its confidently-wrong tail.</p>

<h2>A fourth world, shaped like a live book</h2>
<p>Worlds A–C were built to make the mechanism visible. World D is stylised from the opposite direction: its shape follows what a live LLM trading book tends to look like once outcomes are on the tape. Two regularities matter. The odds are roughly <em>symmetric</em> everywhere — what varies with move size is the win rate, not the payoff ratio. And competence is not where intuition puts it: a large slice of decisions resolves as small chop where the system sits slightly below chance, the genuine edge concentrates in mid-size moves, and the largest, symmetric moves — the ones that decide the book — sit near a coin flip. (Classes here are defined by how decisions <em>resolve</em>, which no system knows in advance; the mixture is a shape, not a playbook, and the numbers are rounded caricatures rather than any particular book's statistics.)</p>

<tr><td>chop</td><td>30%</td><td>0.40</td><td>±0.25</td></tr>
<tr><td>small edge</td><td>30%</td><td>0.58</td><td>±1</td></tr>
<tr><td>mid-size edge</td><td>25%</td><td>0.62</td><td>±2</td></tr>
<tr><td>event tail</td><td>15%</td><td>0.45</td><td>±5</td></tr>
</tbody>
</table></div>
<figure class="fig">
  <div class="fig-head"><span class="fig-title">World D: expected P&amp;L, decomposed</span><span class="fig-num">Fig. 4</span></div>
  <div class="chart-wrap" data-chart="dpnl"></div>
  <figcaption>Total expected P&amp;L per decision for world D, split into the mass the vote hardens toward being right (p&nbsp;&gt;&nbsp;½ — 55% of decisions) and the mass it locks in wrong (p&nbsp;≤&nbsp;½ — the other 45%). The total more than doubles from K&nbsp;=&nbsp;1 to K&nbsp;=&nbsp;9 (+0.08&nbsp;→&nbsp;+0.17), crawls to a peak of +0.23 near K&nbsp;≈&nbsp;37, and decays toward a <strong>negative</strong> limit of −0.03. Accuracy meanwhile drifts from 51.7% to barely 56% — at every K this book's win rate looks like a coin flip with a rounding error, while its economics swing from thin to healthy to ruinous.</figcaption>
  <div class="data-table" data-table="dpnl"></div>
</figure>
<p>Three readings. First, <strong>voting works here — briefly and for a specific reason</strong>. Nearly all of the gain arrives by single-digit K, and it comes entirely from the two edge classes hardening toward certainty; another thirty-odd samples per decision buy +0.06 more, and past the peak the drag mass slowly wins. A small interior K captures most of what repetition will ever give a book shaped like this.</p>
<p>Second, <strong>the tail never settles</strong>. The five-unit class sits at p&nbsp;=&nbsp;0.45: the vote cannot rescue it (it hardens it wrong, slowly), and it cannot stabilise it either — run-to-run dispersion of book P&amp;L falls only ~15% from K&nbsp;=&nbsp;1 to K&nbsp;=&nbsp;9, and only ~30% by K&nbsp;=&nbsp;41, because the decisions that dominate the variance are precisely the ones repetition does not touch. K is a tool for the middle of the book, not its tail.</p>
<p>Third, <strong>win rate is the wrong instrument panel</strong>. From K&nbsp;=&nbsp;1 to the far limit, D's accuracy moves four points; its expected P&amp;L triples, peaks, and then goes negative. Two dashboards watching the same book would tell opposite stories, and the one showing accuracy would recommend raising K exactly as doing so starts to cost money.</p>

<h2>What this note does not claim</h2>
<p>The worlds are two-point caricatures, chosen so everything is exact; real competence is a smear, and a real book is a portfolio selection, not a sequence of isolated binary calls — selection stability under sampling is a harder question we treat separately. The independence assumption is generous: repeated samples of one model share its systematic errors, and both the correlated-jury theory&nbsp;[6] and recent measurement&nbsp;[7] say consensus among correlated voters certifies agreement, not truth. And none of this applies where an external verifier exists — with one, repeated sampling is a genuine accuracy engine&nbsp;[4]; markets simply do not grade before the trade.</p>

<h2>Conclusions, in the simplified setting</h2>
<ol>
<li><strong>The accuracy effect of K is bounded and sign-ambiguous.</strong> Voting moves accuracy from E[p] toward P(p&nbsp;&gt;&nbsp;½), saturating within tens of samples. Whether that is up or down depends entirely on where the model's hard decisions sit relative to the coin-flip line — a quantity single-sample benchmarks do not measure.</li>
<li><strong>The stability effect is real, immediate, and always the right sign.</strong> Repetition is a variance instrument. If the goal is a reproducible system and cheaper evaluation, small K is bought honestly.</li>
<li><strong>Payoff weighting can invert the verdict.</strong> A vote can raise accuracy while lowering expected P&amp;L, and can be profitable at practical K while its limit is negative. Accuracy is the wrong loss function to tune K against.</li>
<li><strong>If accuracy is the goal, K is the wrong dial.</strong> The gains attributed to asking again come from somewhere else: decorrelated information, heterogeneous models&nbsp;[8], or a verifier&nbsp;[4]. More draws from the same distribution mostly tell you, with increasing confidence, what the distribution already was.</li>
</ol>

    cfg.yTicks.forEach((t) => {
      const strong = cfg.zeroLine && t === 0;
      el("line", { x1: m.l, x2: m.l + pw, y1: y(t), y2: y(t), class: strong ? "c-grid-strong" : "c-grid", "stroke-width": 1 }, svg);
      el("text", { x: m.l - 8, y: y(t) + 3.5, "text-anchor": "end", class: "c-tick", "font-size": 11, "font-family": "var(--font-mono)" }, svg).textContent = cfg.fmt(t);
    });
    const xTicks = [1, 9, 17, 25, 33, 41];
    xTicks.forEach((t) => {
      el("line", { x1: x(t), x2: x(t), y1: m.t + ph, y2: m.t + ph + 4, class: "c-grid-strong", "stroke-width": 1 }, svg);
      el("text", { x: x(t), y: m.t + ph + 18, "text-anchor": "middle", class: "c-tick", "font-size": 11, "font-family": "var(--font-mono)" }, svg).textContent = t;
    });
    el("text", { x: m.l + pw / 2, y: H - 4, "text-anchor": "middle", class: "c-axis", "font-size": 11, "font-family": "var(--font-mono)" }, svg).textContent = "K (samples per decision, majority vote)";
    el("text", { x: m.l, y: 12, "text-anchor": "start", class: "c-axis", "font-size": 11, "font-family": "var(--font-mono)" }, svg).textContent = cfg.yLabel;
    if (cfg.topNote) {
      el("text", { x: m.l + pw, y: y(0.5) - 5, "text-anchor": "end", class: "c-tick", "font-size": 10.5, "font-family": "var(--font-mono)" }, svg).textContent = cfg.topNote;
    }

    // asymptote reference marks (short solid ticks at the right edge)
    (cfg.asym || []).forEach((a) => {
      const ln = el("line", { x1: m.l + pw - 26, x2: m.l + pw, y1: y(a.y), y2: y(a.y), "stroke-width": 1, opacity: 0.55 }, svg);
      ln.style.stroke = a.c;
    });

    // series
    const labels = [];
    series.forEach((s) => {
      const vals = s.values;
      const pts = ks.map((k, i) => `${x(k).toFixed(1)},${y(vals[i]).toFixed(1)}`).join(" ");
      const attrs = { points: pts, fill: "none", "stroke-width": s.width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: s.faint ? 0.7 : 1 };
      if (s.dash) attrs["stroke-dasharray"] = s.dash;
      el("polyline", attrs, svg).style.stroke = s.color;
      const endNote = (cfg.endNote && cfg.endNote[s.id]) ? " " + cfg.endNote[s.id] : "";
      labels.push({ y: y(vals[vals.length - 1]), text: s.id + " " + cfg.fmt(vals[vals.length - 1]) + endNote, color: s.color, size: 11.5 });
    });
    (cfg.asym || []).forEach((a) => {
      labels.push({ y: y(a.y), text: "K→∞ " + cfg.fmt(a.y), color: a.c, size: 10, dim: true });
    });
    // right-edge label collision resolution: sort by y, enforce 14px gaps
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) {
      if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
    }
    labels.forEach((L) => {
      const t = el("text", { x: m.l + pw + 8, y: L.y + 3.5, "text-anchor": "start", opacity: L.dim ? 0.6 : 1, "font-size": L.size, "font-family": "var(--font-mono)" }, svg);
      t.style.fill = L.color;
      t.textContent = L.text;
    });

    // hover layer: crosshair + tooltip snapped to nearest K
    const cross = el("line", { x1: 0, x2: 0, y1: m.t, y2: m.t + ph, class: "c-cross", "stroke-width": 1, opacity: 0 }, svg);
    const dots = series.map((s) => {
      const d = el("circle", { r: 3.2, opacity: 0 }, svg);
      d.style.fill = s.color;
      return d;
    });
    const tip = document.createElement("div");
    tip.className = "chart-tip";
    wrap.appendChild(tip);
    const overlay = el("rect", { x: m.l, y: m.t, width: pw, height: ph, fill: "transparent" }, svg);
    const move = (clientX, clientY) => {
      const r = svg.getBoundingClientRect();
      const sx = ((clientX - r.left) / r.width) * W;
      const kf = ks[0] + ((sx - m.l) / pw) * (ks[ks.length - 1] - ks[0]);
      let idx = 0, best = 1e9;
      ks.forEach((k, i) => { const d = Math.abs(k - kf); if (d < best) { best = d; idx = i; } });
      const k = ks[idx];
      cross.setAttribute("x1", x(k)); cross.setAttribute("x2", x(k));
      cross.setAttribute("opacity", 0.7);
      let html = `<div class="k">K = ${k}</div>`;
      series.forEach((s, i) => {
        const v = s.values[idx];
        dots[i].setAttribute("cx", x(k)); dots[i].setAttribute("cy", y(v)); dots[i].setAttribute("opacity", 1);
        html += `<div class="row"><span style="color:${s.color}">${s.id}</span><span class="v">${cfg.fmt(v)}</span></div>`;
      });
      tip.innerHTML = html;
      tip.style.display = "block";
      const wr = wrap.getBoundingClientRect();
      let left = clientX - wr.left + 14;
      if (left + 170 > wr.width) left = clientX - wr.left - 180;
      tip.style.left = left + "px";
      tip.style.top = Math.max(0, clientY - wr.top - 40) + "px";
    };
    const hide = () => {
      cross.setAttribute("opacity", 0);
      dots.forEach((d) => d.setAttribute("opacity", 0));
      tip.style.display = "none";
    };
    overlay.addEventListener("mousemove", (e) => move(e.clientX, e.clientY));
    overlay.addEventListener("mouseleave", hide);
    overlay.addEventListener("touchstart", (e) => { if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    overlay.addEventListener("touchmove", (e) => { if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    overlay.addEventListener("touchend", hide);
  }
  function renderDataTable(holder, key) {
    const cfg = CHARTS[key];
    const series = cfg.series();
    let rows = "";
    D.ks.forEach((k, i) => {
      rows += `<tr><td>K = ${k}</td>` + series.map((s) => `<td>${cfg.fmt(s.values[i])}</td>`).join("") + "</tr>";
    });
    holder.innerHTML = `<details><summary>view the data</summary><div class="scroll"><table>
<thead><tr><th>K</th>${series.map((s) => `<th>${s.label}</th>`).join("")}</tr></thead>
<tbody>${rows}</tbody></table></div></details>`;
  }

  function aboutPage() {
    return `

  /* ---------- router ---------- */
  const root = document.getElementById("main-root");
  function route() {
    const h = (location.hash || "#home").replace(/^#\/?/, "");
    if (h.startsWith("article/")) {
      const a = ARTICLES.find((x) => x.id === h.slice(8));
      return a ? { page: "article", article: a } : { page: "research" };
    }
    if (h === "research" || h === "open-problems") return { page: "research", anchor: h === "open-problems" ? "open-problems" : null };
    if (h === "about") return { page: "about" };
    return { page: "home" };
  }
  function setNav(page) {
    document.querySelectorAll(".site-nav a").forEach((a) => {
      const r = a.getAttribute("data-route");
      const active = (r === "research" && (page === "research" || page === "article")) || r === page;
      a.classList.toggle("active", active);
    });
  }
  function mountDynamic() {
    root.querySelectorAll("[data-plate]").forEach((n) => mountPlate(n, n.dataset.plate, Number(n.dataset.seed)));
    root.querySelectorAll("[data-field]").forEach((n) => {
      const o = JSON.parse(n.dataset.field);
      if (!n.style.height && !n.classList.contains("field")) n.style.height = "150px";
      mountTrajectoryField(n, o);
    });
    root.querySelectorAll("[data-chart]").forEach((n) => renderChart(n, n.dataset.chart));
    root.querySelectorAll("[data-table]").forEach((n) => renderDataTable(n, n.dataset.table));
    // reveal-on-scroll for home pillar cards
    const cards = Array.from(root.querySelectorAll("[data-reveal]"));
    if (cards.length) {
      if (REDUCED || !("IntersectionObserver" in window)) {
        cards.forEach((c) => c.classList.add("on"));
      } else {
        const failsafe = setTimeout(() => cards.forEach((c) => c.classList.add("on")), 2500);
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            io.unobserve(e.target);
            const i = cards.indexOf(e.target);
            setTimeout(() => e.target.classList.add("on"), Math.max(0, i) * 120);
          });
          clearTimeout(failsafe);
        }, { threshold: 0.15 });
        cards.forEach((c) => io.observe(c));
      }
    }
    // research view toggle
    root.querySelectorAll(".view-toggle button").forEach((b) => {
      b.addEventListener("click", () => { researchView = b.dataset.view; render(); });
    });
  }
  function render() {
    const r = route();
    REDRAWS.length = 0; // drop repaint hooks from the previous page
    setNav(r.page);
    root.innerHTML =
      r.page === "home" ? homePage()
      : r.page === "research" ? researchPage()
      : r.page === "about" ? aboutPage()
      : articlePage(r.article);
    document.title = r.page === "article" ? r.article.title + " — Fledge Trading Lab" : "Fledge Trading Lab";
    mountDynamic();
    if (r.anchor) {
      requestAnimationFrame(() => {
        const el2 = document.getElementById(r.anchor);
        if (el2) window.scrollTo({ top: el2.offsetTop - 72, behavior: REDUCED ? "auto" : "smooth" });
      });
    } else {
      window.scrollTo({ top: 0 });
    }
  }
  /* ---------- theme toggle (footer; default dark, persisted) ---------- */
  const toggleButtons = Array.from(document.querySelectorAll("[data-theme-set]"));
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("fledge-theme", t); } catch (e) { /* private mode */ }
    toggleButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
    REDRAWS.forEach((fn) => fn());
  }
  toggleButtons.forEach((b) => b.addEventListener("click", () => applyTheme(b.dataset.themeSet)));
  toggleButtons.forEach((b) => b.setAttribute("aria-pressed", String((isDark() ? "dark" : "light") === b.dataset.themeSet)));

  window.addEventListener("hashchange", render);
  render();
})();
