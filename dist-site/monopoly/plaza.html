<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件街 · 广场</title>
<style>
  /* 场景保持像素，文字一律走正常抗锯齿 ——
     中文在 font-smoothing:none 下几乎不可读，像素味不值这个代价。 */
  :root{
    --ink:#2b2118; --ink2:#5c4a35; --cream:#f7eeda; --cream2:#e7d7b6;
    --line:#3b2f22; --up:#bf3129; --down:#1f7a48; --gold:#e0aa45; --blue:#3f6fa8;
    --ui:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    --num:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace;
    --px:0 0 0 3px var(--line);   /* 硬边框，代替圆角 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#1b222d; color:var(--ink); font-family:var(--ui); font-size:15px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #stage{position:relative}
  canvas{display:block; image-rendering:pixelated; background:#9fd8f2}

  /* NPC 头顶的话 —— 用 DOM 而不是 canvas，免得被最近邻放大糊掉 */
  #bubble{
    position:absolute; max-width:58%; padding:9px 13px; background:var(--cream);
    color:var(--ink); font-size:15px; line-height:1.5; letter-spacing:.3px;
    box-shadow:var(--px); pointer-events:none; transition:opacity .2s;
  }
  #bubble::after{
    content:""; position:absolute; right:16px; bottom:-11px;
    width:12px; height:8px; background:var(--cream);
    box-shadow:0 3px 0 0 var(--line), 3px 0 0 0 var(--line), -3px 0 0 0 var(--line);
  }
  #bubble b{color:var(--up)}

  .hint{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:rgba(20,15,10,.88); color:#f7eeda; padding:8px 18px;
    font-size:15px; letter-spacing:1px; white-space:nowrap; pointer-events:none;
    box-shadow:0 0 0 3px rgba(20,15,10,.88);
    transition:opacity .15s; opacity:0;
  }
  .hint.on{opacity:1}
  .hint kbd{
    font-family:var(--num); background:var(--gold); color:#2b2118;
    padding:1px 7px; margin:0 3px; font-size:14px;
  }
  /* 左上角常驻的玩家条 */
  .corner{
    position:absolute; left:14px; top:14px; padding:8px 14px; cursor:pointer;
    background:rgba(20,15,10,.86); color:#f7eeda; font-size:14px; line-height:1.5;
    box-shadow:0 0 0 3px rgba(20,15,10,.86);
  }
  .corner:hover{background:rgba(20,15,10,.96)}
  .corner b{color:var(--gold); font-family:var(--num); font-size:16px}
  .corner span{opacity:.65; font-size:12.5px}
  .home{
    position:absolute; right:14px; top:14px; padding:8px 14px; z-index:5;
    background:rgba(20,15,10,.86); color:#f7eeda; font-size:13px;
    box-shadow:0 0 0 3px rgba(20,15,10,.86); text-decoration:none;
  }
  .home:hover{background:rgba(20,15,10,.96); color:var(--gold)}
  /* 右上角的中/EN 切换。样式跟 .home 一个模子，叠在它下面。 */
  .lang{
    position:absolute; right:14px; top:57px; padding:8px 14px; z-index:5; cursor:pointer;
    background:rgba(20,15,10,.86); color:#f7eeda; font-size:13px; font-family:var(--ui);
    box-shadow:0 0 0 3px rgba(20,15,10,.86); border:0; letter-spacing:1px;
  }
  .lang:hover{background:rgba(20,15,10,.96)}
  .lang b{color:var(--gold)}

  /* ---------- 对话框 ---------- */
  #dlg,#bag{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(12,10,8,.6); z-index:20; padding:20px;
  }
  #dlg.on,#bag.on{display:flex}
  canvas.face{image-rendering:pixelated; padding:5px}

  /* 背包：称号 / 道具 / 皮肤 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .card{
    background:#fff; padding:13px 15px; box-shadow:inset 0 0 0 3px var(--line);
    display:flex; flex-direction:column; gap:6px;
  }
  .card.locked{background:#efe6d2; color:var(--ink2)}
  .card.on{background:#fff6dd; box-shadow:inset 0 0 0 3px var(--line), inset 0 0 0 8px var(--gold)}
  .card .t{font-size:16px; font-weight:700}
  .card .d{font-size:13px; color:var(--ink2); line-height:1.6; flex:1}
  .card button{
    padding:8px 10px; font-family:var(--ui); font-size:14px; cursor:pointer;
    background:var(--cream2); border:0; box-shadow:inset 0 0 0 3px var(--line);
  }
  .card button:hover:not(:disabled){background:var(--gold)}
  .card button:disabled{opacity:.45; cursor:default}
  .swatch{width:100%; height:52px; box-shadow:inset 0 0 0 3px var(--line)}
  .nickrow{display:flex; gap:10px; align-items:center; margin:10px 0 4px}
  .nickrow input{
    flex:1; padding:10px 13px; font-family:var(--ui); font-size:16px; color:var(--ink);
    background:#fff; border:0; box-shadow:inset 0 0 0 3px var(--line);
  }
  .panel{
    width:min(960px,96vw); max-height:94vh; display:flex; flex-direction:column;
    background:var(--cream); color:var(--ink);
    box-shadow:0 0 0 3px var(--line), 0 0 0 7px var(--cream), 0 0 0 10px var(--line),
               12px 12px 0 10px rgba(0,0,0,.32);
  }
  .head{display:flex; gap:14px; align-items:center; padding:16px 20px; border-bottom:3px solid var(--line)}
  .face{
    width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:32px;
    background:var(--cream2); box-shadow:inset 0 0 0 3px var(--line);
  }
  .who h1{font-size:23px; letter-spacing:1px}
  .who .sub{font-size:14px; color:var(--ink2); margin-top:5px; line-height:1.5}
  .mood{margin-left:auto; text-align:right; font-size:13px; color:var(--ink2); flex:none}
  .mood b{
    display:block; margin-top:5px; font-size:17px; color:var(--ink);
    background:var(--gold); padding:5px 12px; box-shadow:inset 0 0 0 3px var(--line);
  }

  .tabs{display:flex; border-bottom:3px solid var(--line); background:var(--cream2)}
  .tabs button{
    flex:1; padding:13px 4px; font-family:var(--ui); font-size:16px; letter-spacing:3px;
    background:none; border:0; border-right:3px solid var(--line); cursor:pointer; color:var(--ink2);
  }
  .tabs button:last-child{border-right:0}
  .tabs button:hover{background:#efe3c6}
  .tabs button[aria-selected="true"]{background:var(--cream); color:var(--ink); font-weight:700}

  .modes{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center}
  .modes button{
    padding:8px 16px; font-family:var(--ui); font-size:14px; cursor:pointer;
    background:#fff; border:0; box-shadow:inset 0 0 0 3px var(--line); color:var(--ink2);
  }
  .modes button[aria-pressed="true"]{background:var(--gold); color:var(--ink); font-weight:700}
  .days{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}
  .days button{
    padding:5px 11px; font-family:var(--num); font-size:13px; cursor:pointer;
    background:#fff; border:0; box-shadow:inset 0 0 0 2px var(--line); color:var(--ink2);
  }
  .days button[aria-pressed="true"]{background:var(--blue); color:#fff}

  .body{padding:20px 22px; overflow:auto; flex:1; font-size:15px; line-height:1.8}
  .tab{display:none} .tab.on{display:block}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:7px 20px; margin:12px 0}
  .kv dt{color:var(--ink2)} .kv dd{font-weight:700; font-family:var(--num)}

  .quote{
    background:#fffaf0; padding:14px 16px; margin:10px 0; font-size:14px;
    line-height:1.85; white-space:pre-wrap; box-shadow:inset 0 0 0 3px var(--line);
    max-height:230px; overflow:auto; color:var(--ink);
  }
  .tag{
    display:inline-block; margin:4px 7px 4px 0; padding:5px 12px; font-size:14px;
    background:#fff; box-shadow:inset 0 0 0 3px var(--line);
  }
  .lead{color:var(--ink2); margin-top:18px; font-size:14px}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:10px; margin-bottom:16px}
  .stat{background:#fff; padding:11px 13px; box-shadow:inset 0 0 0 3px var(--line)}
  .stat span{display:block; font-size:13px; color:var(--ink2); margin-bottom:2px}
  .stat b{font-size:21px; font-family:var(--num); letter-spacing:-.5px}

  table{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
  th,td{padding:8px 9px; text-align:right; border-bottom:2px solid var(--cream2)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--ink2); font-weight:400; font-size:13px; border-bottom:3px solid var(--line)}
  td{font-family:var(--num)}
  td.reason,td.txt{text-align:left; font-family:var(--ui)}
  td.reason{color:var(--ink2); font-size:13px}
  tbody tr:hover{background:#fffaf0}
  .up{color:var(--up)} .down{color:var(--down)}

  /* ---------- 对赌盘 ---------- */
  .bet{background:#fff; padding:16px; margin-bottom:14px; box-shadow:inset 0 0 0 3px var(--line)}
  .bet .q{font-size:17px; font-weight:700; margin-bottom:6px}
  .bet .say{font-size:14px; color:var(--ink2); margin-bottom:13px; line-height:1.65}
  .odds{display:flex; gap:10px; margin-bottom:8px}
  .odds button{
    flex:1; padding:13px 8px; font-family:var(--ui); font-size:14px; cursor:pointer;
    background:var(--cream2); border:0; box-shadow:inset 0 0 0 3px var(--line); line-height:1.55;
  }
  .odds button:hover:not(:disabled){background:var(--gold)}
  .odds button:disabled{opacity:.4; cursor:default}
  .odds b{display:block; font-size:24px; font-family:var(--num); margin:3px 0}
  .odds i{font-style:normal; font-size:13px; color:var(--ink2); font-family:var(--num)}
  .stakes{display:flex; gap:8px; align-items:center; font-size:14px; color:var(--ink2)}
  .stakes button{
    padding:7px 16px; font-family:var(--num); font-size:14px; cursor:pointer; background:#fff;
    border:0; box-shadow:inset 0 0 0 3px var(--line);
  }
  .stakes button[aria-pressed="true"]{background:var(--blue); color:#fff}
  .result{margin-top:12px; padding:11px 13px; font-size:14px; line-height:1.7;
          box-shadow:inset 0 0 0 3px var(--line)}
  .result.win{background:#dff0e2} .result.lose{background:#f9dcdc}

  .wallet{margin-left:auto; font-size:14px; color:var(--ink2); text-align:right}
  .wallet b{color:var(--ink); font-size:20px; font-family:var(--num)}
  .note{font-size:13px; color:var(--ink2); margin-top:14px; line-height:1.8}
  .close{
    padding:9px 15px; font-family:var(--num); font-size:16px; cursor:pointer;
    background:var(--cream2); border:0; box-shadow:inset 0 0 0 3px var(--line); flex:none;
  }
  .close:hover{background:var(--up); color:#fff}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="bubble"></div>
  <div class="hint" id="hint">按 <kbd>E</kbd> 和摊主说话</div>
  <div class="corner" id="corner"></div>
  <a class="home" id="homeLink" href="index.html">← 事件街棋盘</a>
  <button class="lang" id="langBtn" type="button"><b>中</b> / EN</button>
</div>

<div id="dlg" role="dialog" aria-modal="true">
  <div class="panel">
    <div class="head">
      <div class="face" id="face">🐂</div>
      <div class="who">
        <h1 id="npcName">—</h1>
        <div class="sub" id="npcSub">—</div>
      </div>
      <div class="mood"><span id="moodLbl">此刻心态</span><b id="npcMood">—</b></div>
      <button class="close" onclick="closeDlg()">✕</button>
    </div>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="bets">对赌盘</button>
      <button role="tab" aria-selected="false" data-tab="persona">人设</button>
      <button role="tab" aria-selected="false" data-tab="record">战绩</button>
      <button role="tab" aria-selected="false" data-tab="book">持仓</button>
    </div>

    <div class="body">
      <div class="tab on" id="tab-bets"></div>
      <div class="tab" id="tab-persona"></div>
      <div class="tab" id="tab-record"></div>
      <div class="tab" id="tab-book"></div>
    </div>
  </div>
</div>

<div id="bag" role="dialog" aria-modal="true">
  <div class="panel">
    <div class="head">
      <canvas class="face" id="myFace" width="18" height="18"></canvas>
      <div class="who">
        <h1><span id="myNick">—</span></h1>
        <div class="sub"><span id="myTitle">—</span> <span id="plazaLoc">· 事件街广场</span></div>
      </div>
      <div class="mood"><span id="chipsLbl">我的代币</span><b id="myChips">—</b></div>
      <button class="close" onclick="closeBag()">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-btab="me">身份</button>
      <button role="tab" aria-selected="false" data-btab="record">战绩</button>
      <button role="tab" aria-selected="false" data-btab="hold">注单</button>
      <button role="tab" aria-selected="false" data-btab="items">技能</button>
      <button role="tab" aria-selected="false" data-btab="skins">皮肤</button>
    </div>
    <div class="body">
      <div class="tab on" id="btab-me"></div>
      <div class="tab" id="btab-record"></div>
      <div class="tab" id="btab-hold"></div>
      <div class="tab" id="btab-items"></div>
      <div class="tab" id="btab-skins"></div>
    </div>
  </div>
</div>

<script src="book.js"></script>
<script>
/* ================================================================
   事件街广场 —— 像素场景 + NPC 对话
   数据全部来自 book.js（由 python -m agent.backfill 生成）
   ================================================================ */
const BOOKS = (window.BOOK && window.BOOK.agents && window.BOOK.agents.length)
  ? window.BOOK.agents
  : (window.BOOK ? [window.BOOK] : null);
if (!BOOKS) document.body.innerHTML =
  '<p style="color:#f6ecd6;font-family:monospace;padding:40px;line-height:2">'
  + '缺少 book.js。先运行：<br><br>&nbsp;&nbsp;python -m agent.backfill --days 20</p>';
let B = BOOKS && BOOKS[0];
let dlgB = null;                 // 对话打开时的 book 快照。面板一律读它，别读会被帧循环偷换的 B。
const dlgBook = () => dlgB || B;

/* book.js 的数据要进 innerHTML，一律先过这里。引号也转，属性位才安全。 */
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const esc = escapeHtml;

/* 新管线会在顶层挂 ledger（每注一条，按 id 判定结算）。旧 book.js 没有 —— Map 为空就回退扫 idea。 */
const LEDGER = new Map(((window.BOOK && window.BOOK.ledger) || []).map(r => [r.id, r]));
/* ledger 用小写 yes/no，旧 idea 用大写 YES/NO。比较前一律拉平。 */
const outUp = r => String((r && r.outcome) || '').toUpperCase();

/* ================================================================
   双语 —— chrome 文案走字典；book.js 的数据只在带 *_en 字段时才切英文，
   没有就保持中文原文（管线端设计好的回退，别硬翻）。
   ================================================================ */
const LANG_KEY = 'fledge.lang';
let lang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'zh';
const I18N = {
  zh: {
    title: '事件街 · 广场',
    board: '← 事件街棋盘',
    vendor: '摊主',
    hintTalk: n => `按 <kbd>E</kbd> 和${n}说话`,
    bubbleAsk: (tk, n, c) => `未来${n}天我压 <b>${tk}</b> 收涨，报 ${c}¢。敢不敢？`,
    cornerChips: '代币', cornerBag: '按 B 开背包',
    moodLbl: '此刻心态', myChipsLbl: '我的代币', plazaLoc: '· 事件街广场',
    tab_bets: '对赌盘', tab_persona: '人设', tab_record: '战绩', tab_book: '持仓',
    btab_me: '身份', btab_record: '战绩', btab_hold: '注单', btab_items: '技能', btab_skins: '皮肤',
    personaErrs: '他会犯的错（写死在规则里，按概率触发。鼠标停上去看说明）',
    personaPrompt: '他脑子里的自我认知', notSet: '（未设定）',
    stEquity: '账户净值', stPnl: '累计盈亏', stWinRate: '平仓胜率', stTrades: '成交笔数',
    stIdeaHit: '挂盘命中', stQuote: '他的报价',
    recentClosed: '最近平掉的仓',
    thCloseDate: '平仓日', thTicker: '标的', thPnl: '盈亏', thWhy: '离场原因', thThought: '当时的想法',
    curveNote: (s, hi, lo, dd) =>
      `虚线 ${s} 起点 · 最高 ${hi} · 最低 ${lo} · 期间最大回撤 ${dd}%。鼠标停在点上看那天的心态。`,
    asOfCash: (d, c) => `截至 ${d} 收盘 · 现金 ${c}`,
    thValue: '市值', thWeight: '占净值', thUpnl: '浮盈', thTpSl: '止盈/止损', thEntryReason: '建仓理由',
    noStop: '不设',
    tpslNote: '止盈止损是他建仓当天按概率抽的，不是固定值。抽到「不设」就是真的死扛 —— 这是散户专属的坏毛病。',
    flatNote: '他现在空仓。',
    modeLive: '实盘 · 等收盘揭晓', modeHist: '历史参考 · 近 5 天',
    chipsLbl: '代币', simPnlLbl: '模拟盈亏',
    leadLive: '赌未来 1 / 3 / 5 天的收盘，相对现在是涨还是跌。早盘、夜盘各出一版。答案等美股收盘才公布。',
    leadHist: d => `这是他 ${d} 挂出的题，收盘价已经走完，用来练手。<b>模拟盈亏不计入代币、不影响称号和背包。</b>`,
    buffArmed: n => `已激活 <b>${n}</b>，下一注生效。`,
    noIdeasLive: '他这一轮没挂盘。信念度不够就不硬凑。',
    noIdeasHist: '他这天没挂盘。信念度不够就不硬凑。',
    stakeLbl: '注码', clearPractice: '清空模拟记录', openBagBtn: '打开背包',
    baseNote: '基准是前收，不是当天开盘 —— 隔夜跳空算进涨跌里。',
    vigNote: v => `两边报价加起来大于 1（${v}% 抽水）。`,
    vigZero: '抽水为零，两边报价严格加总到 1.00。',
    calibLead: '这条线怎么来的 · 按期限分开校准',
    thBin: '格子', thN: '历史挂过', thWins: '实际对了', thRealized: '实测命中', thPriceNow: '现在报价',
    calibNote: '报价 = (该格历史命中数 + 40 × 先验) / (该格历史盘数 + 40)。'
      + '1 / 3 / 5 日盘分开算 —— 期限不同，涨的基准率就不同。'
      + '定价只用揭晓之前已结算的盘，今天的实盘不给自己定价。',
    gapNote: (n, q, h, g, over, sig) =>
      `他过去 ${n} 个已揭晓的盘平均报价 ${q}¢，实际对了 ${h}%（${g} 个点的${over ? '高估' : '低估'}）。`
      + (sig < 2
          ? ` ${n} 个样本只到 ${sig.toFixed(1)} 个标准差，还分不清是本事还是运气。`
          : `样本已到 ${sig.toFixed(1)} 个标准差，这个偏离不像是运气。`),
    heSays: r => `他说：「${r}」`,
    convictionLine: (c, n) => `信念度 ${c} · 这条线背后有 ${n} 个已结算的历史盘`
      + (n < 25 ? '，样本还薄，线基本贴着基准率' : ''),
    betYes: '跟随他 · 押涨', betNo: '跟他对赌 · 押跌',
    quoteWin: (c, s, w) => `报价 ${c}¢ · 押 ${s} 赢 ${w}`,
    sideFollow: '跟随', sideFade: '对赌',
    placedPending: (side, st, n) => `已下 ${side} ${st} 代币。等 ${n} 日盘收盘揭晓。`,
    resultHead: (tk, rd, rc, ed, ec, mv, out) =>
      `${tk} ${rd} 收 ${rc} → ${ed} 收 ${ec}（${mv}）· 正确答案 <b>${out}</b>`,
    resultYou: (side, st, prac, won, amt) =>
      `你${side} ${st}，<b>这把${prac ? '模拟' : ''}${won ? '赢了 +' + amt : '输了 −' + amt}</b>`,

/** over：局部调色板覆盖，皮肤靠它换色而不用复制一份精灵图。 */
function sprite(map, x, y, flip, over, g = cx){
  for (let r = 0; r < map.length; r++)
    for (let c = 0; c < map[r].length; c++){
      const ch = map[r][c];
      const col = (over && over[ch]) || PAL[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x + (flip ? map[r].length - 1 - c : c), y + r, 1, 1);
    }
}

/** 玩家战绩。跟随和对赌分开算 —— 这两件事考的能力完全不同。 */
function playerStats(){
  const log = Object.values(P.bets).filter(r => !r.practice && (r.ok === true || r.ok === false));
  const agg = rows => {
    const n = rows.length, w = rows.filter(r => r.ok).length;
    return { n, w, rate: n ? w / n : null,
             pnl: rows.reduce((m, r) => m + (r.ok ? r.win - r.stake : -r.stake), 0) };
  };
  return {
    all: agg(log),
    yes: agg(log.filter(r => r.side === 'YES')),
    no:  agg(log.filter(r => r.side === 'NO')),
    log: log.slice().sort((a, b) => (b.seq || 0) - (a.seq || 0)),
  };
}
const earnedTitles = () => { const s = playerStats(); return TITLES.filter(t => t.test(s)); };

const SLOTS = [
  { x: 72, y: 74, stallX: 44 },
  { x: 224, y: 74, stallX: 196 },
];
function cast(){
  return (BOOKS || []).map((book, i) => ({
    book, ...(SLOTS[i] || { x: 148, y: 74, stallX: 120 }),
    pal: i === 0 ? null : { r: '#3f6fa8', R: '#2c5080', j: '#c4362f', J: '#8f2420' },
  }));
}
function nearestTo(x, y){
  let best = null, bestD = 1e9;
  for (const n of cast()){
    const d = Math.hypot(x - n.x, y - n.y);
    if (d < bestD){ bestD = d; best = n; }
  }
  return best;
}
function nearNpc(){
  const n = nearestTo(hero.x, hero.y);
  if (!n) return null;
  return (Math.abs(hero.x - n.x) < 58 && hero.y - n.y < 78) ? n : null;
}

function drawStall(x){
  const w = 68, awnY = 50, backY = 60, cntY = 92;
  cx.fillStyle = '#7a5c3c'; cx.fillRect(x + 2, backY, w - 4, cntY - backY + 10);
  cx.fillStyle = '#8a6a44'; cx.fillRect(x + 5, backY + 3, w - 10, 26);
  cx.fillStyle = '#c4362f'; cx.fillRect(x - 4, awnY, w + 8, 10);
  cx.fillStyle = '#f6ecd6';
  for (let px = x - 4; px < x + w + 8; px += 10) cx.fillRect(px, awnY, 5, 10);
  cx.fillStyle = '#3b2f22'; cx.fillRect(x - 4, awnY + 10, w + 8, 2);
}
function drawCounter(x){
  const w = 68, cntY = 92;
  cx.fillStyle = '#6b4f33'; cx.fillRect(x - 3, cntY, w + 6, 14);
  cx.fillStyle = '#8a6a44'; cx.fillRect(x - 3, cntY, w + 6, 4);
  cx.fillStyle = '#3b2f22'; cx.fillRect(x - 3, cntY + 13, w + 6, 2);
  cx.fillStyle = '#f6ecd6'; cx.fillRect(x + 6, cntY + 5, 16, 7);
  cx.fillStyle = '#a4906c';
  for (let y = cntY + 7; y < cntY + 12; y += 2) cx.fillRect(x + 8, y, 12, 1);
}

function drawBack(){
  cx.fillStyle = '#9fd8f2'; cx.fillRect(0, 0, 320, 62);          // 天
  cx.fillStyle = '#7bc86c'; cx.fillRect(0, 62, 320, 118);        // 草
  // 广场石板
  cx.fillStyle = '#d9c49a'; cx.fillRect(24, 84, 272, 88);
  cx.fillStyle = '#cbb488';
  for (let y = 84; y < 172; y += 8)
    for (let x = 24 + ((y / 8) % 2 ? 4 : 0); x < 296; x += 16) cx.fillRect(x, y, 8, 1);
  cx.fillStyle = '#b8a074';
  for (let x = 24; x < 296; x += 8) cx.fillRect(x, 84, 4, 1);

  for (const tx of [16, 52, 268, 302]){
    cx.fillStyle = '#5f4a30'; cx.fillRect(tx + 5, 54, 3, 14);
    cx.fillStyle = '#4e9b46'; cx.fillRect(tx, 40, 13, 14);
    cx.fillStyle = '#63b356'; cx.fillRect(tx + 2, 38, 9, 10);
  }

  for (const n of cast()) drawStall(n.stallX);
}

function drawFront(){
  for (const n of cast()) drawCounter(n.stallX);
}

let last = 0;
function loop(t){
  const dt = Math.min(40, t - last); last = t;
  const busy = dlgOpen() || bagOpen();
  let dx = 0, dy = 0;
  if (!busy){                       // 面板打开时忽略移动键，人别在背后乱走
    if (keys.a || keys.arrowleft) dx -= 1;
    if (keys.d || keys.arrowright) dx += 1;
    if (keys.w || keys.arrowup) dy -= 1;
    if (keys.s || keys.arrowdown) dy += 1;
  }
  if (dx || dy){
    const n = Math.hypot(dx, dy) || 1, sp = dt * 0.055;
    hero.x = Math.max(28, Math.min(286, hero.x + dx / n * sp));
    hero.y = Math.max(112, Math.min(154, hero.y + dy / n * sp));
    if (dx) hero.f = dx < 0;
    hero.step += dt;
  }

  drawBack();
  for (const n of cast())
    sprite(NPC, n.x, n.y + (Math.sin(t / 500) > 0 ? 0 : 1), false, n.pal);
  drawFront();
  cx.fillStyle = 'rgba(0,0,0,.16)';
  cx.fillRect(Math.round(hero.x) + 2, Math.round(hero.y) + 16, 12, 3);
  const hop = (dx || dy) && Math.floor(hero.step / 140) % 2 ? 1 : 0;
  sprite(HERO, Math.round(hero.x), Math.round(hero.y) - hop, hero.f, skinPal(P.skin));
  drawMarker(t);

  const who = nearNpc();
  const hint = document.getElementById('hint');
  hint.classList.toggle('on', !!who && !busy);
  if (who){
    const name = esc(aName(who.book.agent)) || T('vendor');
    hint.innerHTML = T('hintTalk', name);
  }
  bubbleEl.style.opacity = busy ? 0 : 1;
  /* 面板打开时不许换 B —— 正看着的摊主不能被走近的另一个偷换掉。 */
  if (who && !busy){ B = who.book; fillBubble(); placeBubble(); }
  requestAnimationFrame(loop);
}

const stat = (k, v, c = '') =>
  `<div class="stat"><span>${k}</span><b class="${c}">${v}</b></div>`;

function curve(c, start){
  if (!c.length) return '';
  const W = 700, H = 200, vals = c.map(p => p.equity);
  const lo = Math.min(start, ...vals), hi = Math.max(start, ...vals);
  const pad = (hi - lo) * 0.12 || 1;
  const X = i => (i / Math.max(1, c.length - 1)) * W;
  const Y = v => H - ((v - lo + pad) / (hi - lo + pad * 2)) * H;
  const pts = c.map((p, i) => `${X(i).toFixed(1)},${Y(p.equity).toFixed(1)}`).join(' ');
  const col = c[c.length - 1].equity >= start ? 'var(--up)' : 'var(--down)';
  const dd = 1 - Math.min(...vals) / Math.max(start, ...vals);
  // preserveAspectRatio=none：让曲线撑满宽度，否则 viewBox 比例不符会左右留白
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
            style="width:100%;height:200px;background:#fff;box-shadow:inset 0 0 0 3px var(--line)">
      <line x1="0" y1="${Y(start)}" x2="${W}" y2="${Y(start)}"
            stroke="#c9bda4" stroke-width="2" stroke-dasharray="7 6"/>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3"
                vector-effect="non-scaling-stroke"/>
      ${c.map((p, i) => `<rect x="${X(i) - 3}" y="${Y(p.equity) - 3}" width="6" height="6"
            fill="${col}"><title>${esc(p.date)} ${money(p.equity)} · ${esc(p.mood)}</title></rect>`).join('')}
    </svg>
    <p class="note">
      ${T('curveNote', money(start), money(Math.max(...vals)), money(Math.min(...vals)), (dd * 100).toFixed(1))}
    </p>`;
}

let betMode = 'live';          // live | history
let histDay = null;

function practicePnl(){
  return Object.values(P.practice || {}).reduce((m, r) => {
    if (r.ok === true) return m + (r.win - r.stake);
    if (r.ok === false) return m - r.stake;
    return m;
  }, 0);
}
function liveIdeasOf(book){
  const live = book && book.live;
  const asOf = live && live.as_of;
  return ((live && live.ideas) || [])
    .filter(i => !asOf || i.date === asOf)
    .slice()
    .sort((a, b) => {
      const s = (a.session === 'final') - (b.session === 'final');
      if (s) return s;
      return (a.horizon || 1) - (b.horizon || 1);
    });
}
function liveIdeas(){
  return liveIdeasOf(dlgBook());
}
function histDays(){
  const bk = dlgBook();
  return ((bk && bk.history) || []).map(d => d.date);
}
function histIdeas(){
  const bk = dlgBook();
  const days = bk && bk.history || [];
  const d = histDay || (days.length ? days[days.length - 1].date : null);
  const row = days.find(x => x.date === d);
  return (row && row.ideas) || [];
}
/* 找 idea 本体（展示用）。live 原始列表 + 近 5 天 history + agent 级完整 ideas 兜底 ——
   老注单的题不在 history[-5:] 里也能找回来。 */
function findIdea(id){
  for (const book of (BOOKS || [])){
    const hit = ((book.live && book.live.ideas) || [])
      .concat((book.history || []).flatMap(d => d.ideas || []))
      .concat(book.ideas || [])
      .find(i => i.id === id);
    if (hit) return hit;
  }
  return null;
}
/* 结算判定源：顶层 ledger 优先（新 book.js），查不到再退回扫 idea。 */
function resolutionOf(id){
  return LEDGER.get(id) || findIdea(id);
}

function vig(){
  const bk = dlgBook();
  return (bk && bk.stats && bk.stats.vig) || 0;
}
function quote(i){
  const p = i.price != null ? i.price : 0.53;
  const v = vig();
  return [Math.min(.97, p + v), Math.min(.97, 1 - p + v)];
}

  return n <= 1 ? when : `${when} · ${T('hzLeft', left)}`;

function gapNote(){
  const s = dlgBook().stats;
  if (s.idea_quoted == null || s.idea_hit_rate == null) return '';
  const gap = s.idea_quoted - s.idea_hit_rate;
  const se = Math.sqrt(0.25 / s.idea_total);
  const sig = Math.abs(s.idea_hit_rate - 0.5) / se;
  return T('gapNote', s.idea_total, (s.idea_quoted * 100).toFixed(0),
           (s.idea_hit_rate * 100).toFixed(0), Math.abs(gap * 100).toFixed(0), gap > 0, sig);
}

/** 封盘判定：bet_cutoff 存在且已过就封。旧数据没这个字段，永远返回 false。 */
function isSealed(i){
  if (!i || !i.bet_cutoff) return false;
  const cut = Date.parse(i.bet_cutoff);
  return !isNaN(cut) && Date.now() > cut;
}

function betCard(i, isLive){
  const book = isLive ? P.bets : (P.practice || {});
  const done = book[i.id];
  const [pYes, pNo] = quote(i);
  const payout = p => (1 / p).toFixed(2);
  const resolved = i.status === 'resolved' && i.outcome;
  const sealed = isLive && !done && isSealed(i);
  const sideTxt = s => s === 'YES' ? T('sideFollow') : T('sideFade');
  let res = '';
  if (done && done.pending){
    res = `<div class="result">${T('placedPending', sideTxt(done.side), done.stake, i.horizon || 1)}</div>`;
  } else if (done && done.refunded){
    res = `<div class="result">${T('refundedCard', done.stake)}</div>`;
  } else if (done && (done.ok === true || done.ok === false)){
    const won = done.ok;
    res = `<div class="result ${won ? 'win' : 'lose'}">
      ${T('resultHead', esc(i.ticker), esc(i.ref_date), esc(i.ref_close), esc(i.exit_date || ''),
          esc(i.exit_close || '—'), sgn(i.move_pct), esc(i.outcome))}<br>
      ${T('resultYou', sideTxt(done.side), done.stake, !!done.practice, won,
          won ? done.win - done.stake : done.stake)}
      ${done.practice ? T('notCounted') : ''}${done.buff
        ? T('buffApplied', ITEMS[done.buff].emoji + ' ' + LN(ITEMS[done.buff])) : ''}。
    </div>`;
  } else if (sealed){
    res = `<div class="result">${T('closedBook')}</div>`;
  } else if (!isLive && !resolved){
    res = `<div class="result">${T('histNotDue')}</div>`;
  }

  const locked = !!done || sealed || (!isLive && !resolved);
  return `<div class="bet">
    <div class="q">${esc(fld(i, 'question'))}</div>
    <div class="say">${T('heSays', esc(fld(i, 'reason')))} <span style="opacity:.7">（${esc(fld(i, 'mood'))}${sessionTag(i) ? ' · ' + sessionTag(i) : ''} · ${horizonTag(i)}）</span>
      <br><span style="opacity:.7">${T('convictionLine', (i.conviction * 100).toFixed(0), i.n_prior)}</span></div>
    <div class="odds">
      <button data-bet="${esc(i.id)}" data-side="YES" ${locked ? 'disabled' : ''}>
        ${T('betYes')}<b>${payout(pYes)}×</b>
        <i>${T('quoteWin', (pYes * 100).toFixed(0), stake, Math.round(stake / pYes - stake))}</i></button>
      <button data-bet="${esc(i.id)}" data-side="NO" ${locked ? 'disabled' : ''}>
        ${T('betNo')}<b>${payout(pNo)}×</b>
        <i>${T('quoteWin', (pNo * 100).toFixed(0), stake, Math.round(stake / pNo - stake))}</i></button>
    </div>
    ${res}</div>`;
}

function place(id, side, isLive){
  if (isLive) placeLive(id, side);
  else placePractice(id, side);
}

function placeLive(id, side){
  if (P.bets[id]) return;
  const i = findIdea(id);
  if (!i) return;
  if (isSealed(i)){ renderBets(); return; }        // 已封盘，拒单（旧数据没 cutoff，不受影响）
  if (P.chips < stake){ alert(T('alertNoChips')); return; }
  const [pYes, pNo] = quote(i);
  const buff = P.buff;
  const bk = dlgBook();
  let win = Math.round(stake / (side === 'YES' ? pYes : pNo));
  P.seq = (P.seq || 0) + 1;
  /* 快照题面：就算这个 idea 以后从 book.js 里消失，背包也说得清这注押的是什么。 */
  const rec = { side, stake, win, buff, seq: P.seq, at: Date.now(),
                ticker: i.ticker, date: i.date, price: i.price, horizon: i.horizon,
                question: i.question, q_en: i.q_en || null,
                agent: (bk && bk.agent && bk.agent.name) || null,
                practice: false };

  const r = resolutionOf(id) || i;                 // 结算判定优先 ledger
  if (r.status !== 'resolved' || !r.outcome){
    P.chips -= stake;
    rec.pending = true; rec.ok = null;
  } else {
    const out = outUp(r);
    if (buff === 'rumor' && side === out) win = Math.round(win * 1.25);
    rec.win = win;
    rec.ok = side === out;
    rec.pending = false;
    P.chips += rec.ok ? win - stake : -stake;
    P.peak = Math.max(P.peak, P.chips);
  }
  if (buff) P.buff = null;
  P.bets[id] = rec;
  saveP();
  renderBets();
}

/** 历史盘：只记对错，绝不改 P.chips / P.peak / 称号。 */
function placePractice(id, side){
  P.practice = P.practice || {};
  if (P.practice[id]) return;
  const i = findIdea(id);
  if (!i || i.status !== 'resolved' || !i.outcome) return;
  const [pYes, pNo] = quote(i);
  const bk = dlgBook();
  const win = Math.round(stake / (side === 'YES' ? pYes : pNo));
  P.practice[id] = {
    side, stake, win, ok: side === outUp(i), pending: false, practice: true,
    ticker: i.ticker, date: i.date, price: i.price, horizon: i.horizon,
    question: i.question, q_en: i.q_en || null,
    agent: (bk && bk.agent && bk.agent.name) || null, at: Date.now(),
  };
  saveP();
  renderBets();
}

function resetPractice(){
  P.practice = {};
  saveP();
  renderBets();
}

/** 实盘揭晓后入账。判定优先走顶层 ledger（新 book.js），没有再回退扫 idea。 */
function settleLiveBets(){
  let changed = false;
  for (const [id, rec] of Object.entries(P.bets || {})){
    if (!rec.pending) continue;
    const r = resolutionOf(id);
    if (!r || r.status !== 'resolved' || !r.outcome) continue;
    rec.ok = rec.side === outUp(r);   // ledger 是小写 yes/no，旧 idea 是大写，拉平再比
    rec.pending = false;
    let win = rec.win;
    if (rec.buff === 'rumor' && rec.ok) win = Math.round(win * 1.25);
    rec.win = win;
    if (rec.ok) P.chips += win;       // 本金已扣，赢了把派彩加回来
    P.peak = Math.max(P.peak, P.chips);
    changed = true;
  }
  if (changed) saveP();
}

/** 最后兜底：>30 天还 pending（idea/ledger 都给不出答案）的注退回本金，防筹码黑洞。 */
function refundBet(id){
  const b = P.bets[id];
  if (!b || !b.pending) return;
  b.pending = false;
  b.ok = null;
  b.refunded = true;
  P.chips += b.stake;
  P.peak = Math.max(P.peak, P.chips);
  saveP();
  renderBag();
}

/* ================================================================
   背包
   ================================================================ */
const openBag = () => { closeDlg(); $('bag').classList.add('on'); renderBag(); };
const closeBag = () => $('bag').classList.remove('on');
const bagOpen = () => $('bag').classList.contains('on');

document.querySelectorAll('[data-btab]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-btab]').forEach(b =>
      b.setAttribute('aria-selected', b === btn));
    document.querySelectorAll('#bag .tab').forEach(t =>
      t.classList.toggle('on', t.id === 'btab-' + btn.dataset.btab));
  };
});
$('bag').addEventListener('click', e => { if (e.target.id === 'bag') closeBag(); });

function renderBag(){
  const s = playerStats();
  const earned = earnedTitles();

  $('myNick').textContent = P.nick;
  $('myTitle').textContent = titleName();
  $('myChips').textContent = P.chips;
  drawFace();

  /* ---- 身份 ---- */
  $('btab-me').innerHTML = `
    <p class="lead" style="margin-top:0">${T('nickLbl')}</p>
    <div class="nickrow">
      <input id="nickInput" maxlength="12" value="${esc(P.nick)}">
      <button class="close" onclick="saveNick()">${T('renameBtn')}</button>
    </div>
    <p class="lead">${T('titlesLead')}</p>
    <div class="grid">
      ${TITLES.map(t => {
        const got = earned.some(e => e.id === t.id);
        const on = (P.title || 'rookie') === t.id;
        return `<div class="card ${got ? (on ? 'on' : '') : 'locked'}">
          <div class="t">${LN(t)}${got ? '' : ' 🔒'}</div>
          <div class="d">${LD(t)}</div>
          <button ${got && !on ? `onclick="equipTitle('${t.id}')"` : 'disabled'}>
            ${on ? T('wearing') : got ? T('wear') : T('lockedTxt')}</button>
        </div>`;
      }).join('')}
    </div>
    <p class="note">${T('titlesNote')}</p>`;

  /* ---- 战绩 ---- */
  const cmp = B.stats.idea_hit_rate;
  $('btab-record').innerHTML = `
    <div class="stats">
      ${stat(T('stChips'), P.chips, cls(P.chips - P.start))}
      ${stat(T('stPnl'), (s.all.pnl >= 0 ? '+' : '') + s.all.pnl, cls(s.all.pnl))}
      ${stat(T('stPeak'), P.peak)}
      ${stat(T('stBets'), s.all.n)}
      ${stat(T('stRate'), pct(s.all.rate))}
    </div>
    <p class="lead" style="margin-top:0">${T('fvsLead')}</p>
    <table><thead><tr>
      <th>${T('thWay')}</th><th>${T('thHands')}</th><th>${T('thWon')}</th>
      <th>${T('thRate')}</th><th>${T('thPnl')}</th>
    </tr></thead><tbody>
      <tr><td class="txt">${T('rowFollow')}</td><td>${s.yes.n}</td><td>${s.yes.w}</td>
          <td>${pct(s.yes.rate)}</td>
          <td class="${cls(s.yes.pnl)}">${s.yes.pnl >= 0 ? '+' : ''}${s.yes.pnl}</td></tr>
      <tr><td class="txt">${T('rowFade')}</td><td>${s.no.n}</td><td>${s.no.w}</td>
          <td>${pct(s.no.rate)}</td>
          <td class="${cls(s.no.pnl)}">${s.no.pnl >= 0 ? '+' : ''}${s.no.pnl}</td></tr>
    </tbody></table>
    <p class="note">
      ${T('vsNote', esc(aName(B.agent)), pct(cmp))}
      ${s.all.n < 10
        ? T('vsFew', s.all.n)
        : s.all.rate > cmp
        ? T('vsAhead', pct(s.all.rate), ((s.all.rate - cmp) * 100).toFixed(0))
        : T('vsBehind', pct(s.all.rate))}
    </p>`;

  /* ---- 注单 ---- */
  /* 进行中（含已退款）的实盘注。题面读下注时的快照，idea 从 book.js 消失也显示得出来。 */
  const STALE_MS = 30 * 86400 * 1000;
  const openBets = Object.entries(P.bets || {})
    .filter(([, r]) => !r.practice && (r.pending || r.refunded))
    .sort((a, b) => (b[1].seq || 0) - (a[1].seq || 0));
  const openRows = openBets.map(([id, b]) => {
    const q = (lang === 'en' && b.q_en) || b.question || (findIdea(id) || {}).question || '—';
    const stale = b.pending && (!b.at || Date.now() - b.at > STALE_MS);
    return `<tr>
      <td>${esc((b.date || '').slice(5))}</td><td>${esc(b.ticker || '—')}</td>
      <td class="txt">${esc(b.agent || '—')}</td>
      <td class="txt">${esc(q)}</td>
      <td class="txt">${b.side === 'YES' ? T('sideFollow') : T('sideFade')}</td>
      <td>${b.stake}</td>
      <td class="txt">${b.refunded ? T('refundedTag')
        : stale ? `<button data-refund="${esc(id)}">${T('refundBtn')}</button>`
        : T('pendingTxt')}</td>
    </tr>`;
  }).join('');

  $('btab-hold').innerHTML = `
    ${openBets.length ? `
    <p class="lead" style="margin-top:0">${T('holdLeadPending')}</p>
    <table><thead><tr>
      <th>${T('thPostDate')}</th><th>${T('thTicker')}</th><th>${T('thVendor')}</th>
      <th>${T('thQuestion')}</th><th>${T('thWay')}</th><th>${T('thStake')}</th><th>${T('thStatus')}</th>
    </tr></thead><tbody>${openRows}</tbody></table>
    <p class="note">${T('refundNote')}</p>` : ''}
    <p class="lead" ${openBets.length ? '' : 'style="margin-top:0"'}>${T('holdLead')}</p>
    ${s.log.length ? `<table><thead><tr>
      <th>${T('thPostDate')}</th><th>${T('thTicker')}</th><th>${T('thWay')}</th>
      <th>${T('thQuote')}</th><th>${T('thStake')}</th><th>${T('thResult')}</th><th>${T('thPnl')}</th>
    </tr></thead><tbody>
      ${s.log.slice(0, 20).map(b => `<tr>
        <td>${esc((b.date || '').slice(5))}</td><td>${esc(b.ticker || '—')}</td>
        <td class="txt">${b.side === 'YES' ? T('sideFollow') : T('sideFade')}</td>
        <td>${b.price == null ? '—'
             : ((b.side === 'YES' ? b.price : 1 - b.price) * 100).toFixed(0) + '¢'}</td>
        <td>${b.stake}</td>
        <td class="txt ${b.ok ? 'up' : 'down'}">${b.ok ? T('wonTxt') : T('lostTxt')}</td>
        <td class="${b.ok ? 'up' : 'down'}">${b.ok ? '+' + (b.win - b.stake) : '−' + b.stake}</td>
      </tr>`).join('')}
    </tbody></table>` : `<p>${T('noBets', esc(aName(B.agent)))}</p>`}
    <p class="note">${T('holdNote1')}</p>
    <p class="note">${T('holdNote2')}</p>`;
  $('btab-hold').querySelectorAll('[data-refund]').forEach(b =>
    b.onclick = () => refundBet(b.dataset.refund));

  /* ---- 技能 ---- */
  $('btab-items').innerHTML = `
    <p class="lead" style="margin-top:0">
      ${T('itemsLead')} ${P.buff ? T('itemsArmed', ITEMS[P.buff].emoji + ' ' + LN(ITEMS[P.buff])) : ''}
    </p>
    <div class="grid">
      ${Object.entries(ITEMS).map(([k, it]) => {
        const n = P.items[k] || 0;
        const active = P.buff === k;
        return `<div class="card ${active ? 'on' : ''}">
          <div class="t">${it.emoji} ${LN(it)} <span style="opacity:.6">×${n}</span></div>
          <div class="d">${LD(it)}</div>
          <div style="display:flex;gap:8px">
            ${k === 'calm'
              ? `<button ${n > 0 && Object.keys(P.bets).length ? 'onclick="undoLastBet()"'
                   : 'disabled'} style="flex:1">${T('useBtn')}</button>`
              : `<button ${n > 0 && !active ? `onclick="useItem('${k}')"` : 'disabled'}
                   style="flex:1">${active ? T('armedBtn') : T('equipBtn')}</button>`}
            <button onclick="buyItem('${k}')" ${P.chips < it.cost ? 'disabled' : ''}
              style="flex:1">${T('buyBtn', it.cost)}</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  /* ---- 皮肤 ---- */
  $('btab-skins').innerHTML = `
    <p class="lead" style="margin-top:0">${T('skinsLead')}</p>
    <div class="grid">
      ${Object.entries(SKINS).map(([k, sk]) => {
        const got = P.skins.includes(k);
        const on = P.skin === k;
        return `<div class="card ${got ? (on ? 'on' : '') : 'locked'}">
          <div class="swatch" style="background:${sk.c}"></div>
          <div class="t">${LN(sk)}</div>
          <div class="d">${LD(sk)}</div>
          ${got ? `<button ${on ? 'disabled' : `onclick="equipSkin('${k}')"`}>
                     ${on ? T('skinWearing') : T('skinWear')}</button>`
                : `<button ${P.chips < sk.cost ? 'disabled' : ''}
                     onclick="buySkin('${k}')">${T('skinBuy', sk.cost)}</button>`}
        </div>`;
      }).join('')}
    </div>`;
}

/** 背包头像：把广场上那个精灵原样画出来，皮肤换了这里立刻变。 */
function drawFace(){
  const c = $('myFace'), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 18, 18);
  sprite(HERO, 1, 1, false, skinPal(P.skin), g);
}

function saveNick(){
  const v = $('nickInput').value.trim();
  if (v){ P.nick = v.slice(0, 12); saveP(); renderBag(); }
}
function equipTitle(id){ P.title = id; saveP(); renderBag(); }
function equipSkin(id){ P.skin = id; saveP(); renderBag(); }
function buySkin(id){
  const sk = SKINS[id];
  if (P.chips < sk.cost) return;
  P.chips -= sk.cost; P.skins.push(id); P.skin = id; saveP(); renderBag();
}
function buyItem(k){
  const it = ITEMS[k];
  if (P.chips < it.cost) return;
  P.chips -= it.cost; P.items[k] = (P.items[k] || 0) + 1; saveP(); renderBag();
}
function useItem(k){
  if ((P.items[k] || 0) <= 0) return;
  P.items[k] -= 1; P.buff = k; saveP(); renderBag();
}

/** 冷静一下：撤销最近一注，退回本金。 */
function undoLastBet(){
  /* 已退款的注本金早回来了，再冲销一次就是白送钱 —— 跳过。 */
  const log = Object.entries(P.bets).filter(([, b]) => !b.refunded)
    .sort((a, b) => (b[1].seq || 0) - (a[1].seq || 0));
  if (!log.length){ alert(T('alertNoBets')); return; }
  const [id, b] = log[0];
  P.chips -= b.ok ? b.win - b.stake : -b.stake;   // 反向冲销
  delete P.bets[id];
  P.items.calm = (P.items.calm || 0) - 1;
  saveP(); renderBag(); renderBets();
}
