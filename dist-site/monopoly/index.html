<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件街 · Event Street — Agent 试炼场</title>
<style>
  :root {
    --felt: #17301F;          /* 赌桌呢面深绿 */
    --felt-line: #24422F;
    --cream: #F2EBD8;         /* 地格米色 */
    --cream-dim: #E4DAC0;
    --ink: #201D16;
    --gold: #C9A227;
    --gold-bright: #E3BC45;
    --paper: #1E3627;         /* 面板底 */
    --paper-edge: #2C4A36;
    --text: #EDE6D2;
    --text-dim: #A8B49B;
    --win: #6FBF8F;
    --loss: #D96A5B;
    --cat-tech: #34558B;
    --cat-biz: #8C4A5E;
    --cat-macro: #6B7A3A;
    --cat-geo: #A8642F;
    --cat-crypto: #58468C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--felt);
    background-image: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.045), transparent 60%);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    min-height: 100vh;
  }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3, .serif { font-family: "Songti SC", "Noto Serif SC", "STSong", serif; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
  header.masthead { text-align: center; padding: 8px 0 18px; position: relative; }
  header.masthead h1 {
    margin: 0; font-size: 40px; letter-spacing: 0.12em; color: var(--gold-bright);
    text-shadow: 0 1px 0 rgba(0,0,0,0.5);
  }
  header.masthead .sub { color: var(--text-dim); font-size: 14px; letter-spacing: 0.25em; margin-top: 6px; }
  header.masthead .plaza-link {
    display: inline-block; margin-top: 14px;
    color: var(--gold-bright); text-decoration: none;
    font-size: 14px; letter-spacing: 0.12em;
    border: 1px solid var(--gold); border-radius: 999px;
    padding: 6px 16px;
  }
  header.masthead .plaza-link:hover { background: rgba(201,162,39,0.15); }
  .lang-toggle {
    position: absolute; top: 4px; right: 0;
    background: #142A1C; color: var(--gold-bright); border: 1px solid var(--gold);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    letter-spacing: 0.08em; font-family: inherit;
  }
  .lang-toggle:hover { background: rgba(201,162,39,0.15); }

  /* ============ 捏 Agent 界面 ============ */
  .setup {
    max-width: 860px; margin: 0 auto;
    background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 14px;
    padding: 26px 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .setup h2 { margin: 0 0 4px; color: var(--gold-bright); font-size: 22px; letter-spacing: 0.08em; }
  .setup .hint-line { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--gold); letter-spacing: 0.08em; margin-bottom: 6px; }
  .field input[type=text], .field input[type=password], .field textarea, .field select {
    width: 100%; background: #142A1C; color: var(--text);
    border: 1px solid var(--paper-edge); border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-family: inherit;
  }
  .field textarea { min-height: 108px; line-height: 1.65; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
  .row2 { display: flex; gap: 14px; flex-wrap: wrap; }
  .row2 > .field { flex: 1; min-width: 200px; }
  .avatar-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .avatar-row button {
    font-size: 22px; width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
    background: #142A1C; border: 1px solid var(--paper-edge);
  }
  .avatar-row button.sel { border: 2px solid var(--gold-bright); background: #1E3A28; }
  .preset-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .preset-row button {
    flex: 1; min-width: 150px; cursor: pointer; text-align: left;
    background: #142A1C; color: var(--text); border: 1px solid var(--paper-edge); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; line-height: 1.5; font-family: inherit;
  }
  .preset-row button b { color: var(--gold-bright); display: block; margin-bottom: 2px; font-size: 14px; }
  .preset-row button:hover { border-color: var(--gold); }
  .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; }
  .slider-item label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-dim); margin-bottom: 3px; }
  .slider-item label .val { color: var(--gold-bright); }
  .slider-item input[type=range] { width: 100%; accent-color: var(--gold); }
  .brain-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .brain-tabs button {
    cursor: pointer; padding: 8px 16px; border-radius: 999px; font-size: 13.5px; font-family: inherit;
    background: #142A1C; color: var(--text-dim); border: 1px solid var(--paper-edge);
  }
  .brain-tabs button.sel { background: var(--gold); color: #241F0E; border-color: var(--gold); font-weight: 700; }
  .api-fields { display: none; }
  .api-fields.show { display: block; }
  .note { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .go-btn {
    display: block; width: 100%; margin-top: 20px; cursor: pointer;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241F0E; font-size: 18px; font-weight: 800; letter-spacing: 0.2em;
    border: none; border-radius: 10px; padding: 14px; font-family: "Songti SC", "Noto Serif SC", serif;
    box-shadow: 0 6px 18px rgba(201,162,39,0.25);
  }
  .go-btn:hover { filter: brightness(1.06); }

  /* ============ 游戏界面 ============ */
  .game { display: none; grid-template-columns: minmax(0, 700px) minmax(320px, 1fr); gap: 20px; align-items: start; }
  .game.show { display: grid; }
  @media (max-width: 1020px) { .game.show { grid-template-columns: 1fr; } }

  .board {
    aspect-ratio: 1; width: 100%;
    display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr);
    gap: 4px; padding: 10px;
    background: var(--felt-line); border-radius: 14px; border: 3px solid var(--gold);
    box-shadow: 0 14px 44px rgba(0,0,0,0.45), inset 0 0 60px rgba(0,0,0,0.3);
  }
  .tile {
    background: var(--cream); color: var(--ink); border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; font-size: 11px; text-align: center; padding: 3px 2px; gap: 1px;
    overflow: hidden; min-width: 0;
  }
  .tile .band { position: absolute; top: 0; left: 0; right: 0; height: 6px; }
  .tile .t-emoji { font-size: clamp(14px, 2.6vw, 22px); line-height: 1.1; margin-top: 4px; }
  .tile .t-name { font-size: clamp(8px, 1.2vw, 10.5px); color: #5A5344; line-height: 1.15; }
  .tile.corner { background: var(--cream-dim); border: 1.5px solid var(--gold); }
  .tile.active { outline: 3px solid var(--gold-bright); outline-offset: -2px; box-shadow: 0 0 18px rgba(227,188,69,0.55); }
  .tile .pawn {
    position: absolute; bottom: 2px; right: 3px; font-size: clamp(13px, 2vw, 19px);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    transition: transform 0.15s;
  }
  .board-center {
    grid-area: 2 / 2 / 7 / 7;
    background: radial-gradient(ellipse at center, #1D3A28, #152B1D 75%);
    border-radius: 10px; border: 1px solid var(--paper-edge);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 14px; text-align: center;
  }
  .board-center .bc-title { font-size: clamp(16px, 2.4vw, 24px); color: var(--gold-bright); letter-spacing: 0.18em; }
  .board-center .bankroll { font-size: clamp(26px, 4.4vw, 44px); font-weight: 800; color: var(--text); }
  .board-center .bankroll .unit { font-size: 0.45em; color: var(--text-dim); margin-left: 4px; }
  .board-center .bankroll.flash-up { color: var(--win); }
  .board-center .bankroll.flash-down { color: var(--loss); }
  .board-center .sub-stats { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-dim); }
  .board-center .dice { font-size: clamp(24px, 3.6vw, 36px); min-height: 1.2em; }
  .board-center .spark-mini { opacity: 0.9; }
  .ctrl-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .ctrl-row button {
    cursor: pointer; background: #142A1C; color: var(--text); border: 1px solid var(--paper-edge);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-family: inherit;
  }
  .ctrl-row button:hover { border-color: var(--gold); }
  .ctrl-row button.primary { background: var(--gold); color: #241F0E; font-weight: 700; border-color: var(--gold); }
  .ctrl-row select { background: #142A1C; color: var(--text); border: 1px solid var(--paper-edge); border-radius: 8px; padding: 7px 8px; font-size: 13px; }

  /* 右侧面板 */
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel {
    background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 12px; padding: 14px 16px;
  }
  .panel h3 { margin: 0 0 10px; font-size: 15px; color: var(--gold-bright); letter-spacing: 0.12em; }
  .feed { height: 430px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
  .msg { max-width: 92%; border-radius: 10px; padding: 9px 12px; font-size: 13.5px; line-height: 1.6; }
  .msg .who { font-size: 11.5px; letter-spacing: 0.1em; margin-bottom: 3px; opacity: 0.8; }
  .msg.npc { align-self: flex-start; background: var(--cream); color: var(--ink); border-bottom-left-radius: 3px; }
  .msg.npc .who { color: #7A6B3E; }
  .msg.agent { align-self: flex-end; background: #2E3E1F; border: 1px solid #4A5C33; border-bottom-right-radius: 3px; }
  .msg.agent .who { color: var(--gold-bright); }
  .msg.sys { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; padding: 2px 6px; text-align: center; }
  .msg.reveal-win { align-self: center; background: #22402E; border: 1px solid var(--win); width: 92%; }
  .msg.reveal-loss { align-self: center; background: #3E2723; border: 1px solid var(--loss); width: 92%; }
  .msg.reveal-skip { align-self: center; background: #26332A; border: 1px dashed var(--text-dim); width: 92%; }
  .intel { margin-top: 6px; border-top: 1px dashed #B4A87E; padding-top: 6px; }
  .intel ul { margin: 4px 0 0; padding-left: 16px; }
  .intel li { margin-bottom: 2px; }
  .quote-line { margin-top: 7px; font-weight: 700; }
  .quote-line .px { font-family: ui-monospace, Menlo, monospace; background: #241F0E; color: var(--gold-bright); border-radius: 5px; padding: 1px 7px; }
  .pl-pos { color: var(--win); font-weight: 800; }
  .pl-neg { color: var(--loss); font-weight: 800; }

  .agent-panel summary { cursor: pointer; color: var(--gold); font-size: 13.5px; letter-spacing: 0.06em; }
  .agent-panel .field { margin-top: 10px; margin-bottom: 8px; }
  .agent-panel textarea { min-height: 80px; font-size: 13px; }
  .apply-note { font-size: 11.5px; color: var(--win); display: none; }

  .logbox { max-height: 210px; overflow-y: auto; font-size: 12.5px; }
  .logrow { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed #2C4A36; }
  .logrow .l-left { color: var(--text-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logrow .l-right { flex-shrink: 0; }

  /* 结算 modal */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(8, 16, 11, 0.82);
    align-items: center; justify-content: center; z-index: 50; padding: 18px;
  }
  .overlay.show { display: flex; }
  .final {
    background: var(--paper); border: 2px solid var(--gold); border-radius: 16px;
    max-width: 640px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 28px 30px;
    box-shadow: 0 20px 70px rgba(0,0,0,0.6);
  }
  .final h2 { margin: 0 0 2px; color: var(--gold-bright); font-size: 26px; letter-spacing: 0.15em; text-align: center; }
  .final .rating { text-align: center; font-size: 18px; margin: 6px 0 14px; color: var(--text); }
  .final .big-final { text-align: center; font-size: 44px; font-weight: 800; margin: 6px 0; }
  .final .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .final .stat { background: #142A1C; border: 1px solid var(--paper-edge); border-radius: 10px; padding: 10px; text-align: center; }
  .final .stat .k { font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.08em; }
  .final .stat .v { font-size: 19px; font-weight: 700; margin-top: 3px; }
  .final table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0; }
  .final th, .final td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #2C4A36; }
  .final th { color: var(--gold); font-weight: 600; letter-spacing: 0.05em; }
  .final td.r, .final th.r { text-align: right; }
  .final .btn-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .final .btn-row button { flex: 1; min-width: 140px; cursor: pointer; border-radius: 9px; padding: 11px; font-size: 14px; font-family: inherit; border: 1px solid var(--paper-edge); background: #142A1C; color: var(--text); }
  .final .btn-row button.primary { background: var(--gold); color: #241F0E; font-weight: 700; border-color: var(--gold); }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #3E2723; border: 1px solid var(--loss); color: var(--text);
    border-radius: 9px; padding: 10px 18px; font-size: 13.5px; z-index: 99;
    display: none; max-width: 90vw;
  }
  .toast.show { display: block; }
  footer.credits { text-align: center; color: var(--text-dim); font-size: 11.5px; margin-top: 26px; line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="masthead">
    <button class="lang-toggle" id="langToggle" type="button">EN</button>
    <h1>事 件 街</h1>
    <div class="sub" id="mastSub">EVENT STREET · AGENT 试炼场</div>
    <a class="plaza-link" id="plazaLink" href="plaza.html">像素广场 · 和热搜老哥对赌 →</a>
  </header>

  <!-- ============ 捏 Agent ============ -->
  <section class="setup" id="setupView">
    <h2 id="stTitle">捏一个交易 Agent</h2>
    <p class="hint-line" id="stHint"></p>

    <div class="row2">
      <div class="field" style="flex:2">
        <label id="fName">AGENT 名字</label>
        <input type="text" id="agentName" value="小虎" maxlength="16">
      </div>
      <div class="field" style="flex:3">
        <label id="fAvatar">棋子</label>
        <div class="avatar-row" id="avatarRow"></div>
      </div>
    </div>

    <div class="field">
      <label id="fBrain">大脑</label>
      <div class="brain-tabs">
        <button id="tabSim" class="sel" type="button"></button>
        <button id="tabApi" type="button"></button>
      </div>
      <div class="api-fields" id="apiFields">
        <div class="row2">
          <div class="field" style="flex:2">
            <label id="fKey">ANTHROPIC API KEY</label>
            <input type="password" id="apiKey" placeholder="sk-ant-...">
          </div>
          <div class="field" style="flex:1">
            <label id="fModel">MODEL</label>
            <select id="apiModel">
              <option value="claude-opus-5">claude-opus-5</option>
              <option value="claude-sonnet-5">claude-sonnet-5</option>
              <option value="claude-haiku-4-5">claude-haiku-4-5</option>
            </select>
          </div>
        </div>
        <p class="note" id="apiNote"></p>
      </div>
      <p class="note" id="simNote"></p>
    </div>

    <div class="field">
      <label id="fPreset">快速人格模板</label>
      <div class="preset-row">
        <button type="button" data-preset="value"><b id="pvT"></b><span id="pvD"></span></button>
        <button type="button" data-preset="hunter"><b id="phT"></b><span id="phD"></span></button>
        <button type="button" data-preset="yolo"><b id="pyT"></b><span id="pyD"></span></button>
      </div>
    </div>

    <div class="field">
      <label id="fPrompt">AGENT PROMPT</label>
      <textarea id="agentPrompt"></textarea>
    </div>

    <div class="field">
      <label id="fTraits">模拟脑性格参数</label>
      <div class="slider-grid">
        <div class="slider-item">
          <label><span id="uKelly"></span><span class="val" id="vKelly">0.25</span></label>
          <input type="range" id="sKelly" min="5" max="100" value="25">
        </div>
        <div class="slider-item">
          <label><span id="uEdge"></span><span class="val" id="vEdge">5pt</span></label>
          <input type="range" id="sEdge" min="0" max="15" value="5">
        </div>
        <div class="slider-item">
          <label><span id="uConf"></span><span class="val" id="vConf">0.55</span></label>
          <input type="range" id="sConf" min="0" max="100" value="55">
        </div>
        <div class="slider-item">
          <label><span id="uContra"></span><span class="val" id="vContra">0.0</span></label>
          <input type="range" id="sContra" min="-100" max="100" value="0">
        </div>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label id="fSeed">SEED</label>
        <input type="text" id="seedInput" value="fledge-2026">
      </div>
      <div class="field" style="max-width:150px">
        <label>&nbsp;</label>
        <button type="button" id="randSeed" style="width:100%;padding:10px;background:#142A1C;color:var(--text);border:1px solid var(--paper-edge);border-radius:8px;cursor:pointer;font-family:inherit;"></button>
      </div>
    </div>

    <button class="go-btn" id="startBtn" type="button"></button>
  </section>

  <!-- ============ 棋盘 ============ -->
  <section class="game" id="gameView">
    <div>
      <div class="board" id="board"></div>
    </div>
    <div class="side">
      <div class="panel">
        <h3 id="feedTitle">交易大厅</h3>
        <div class="feed" id="feed"></div>
      </div>
      <div class="panel">
        <div class="ctrl-row" style="justify-content:flex-start">
          <button id="pauseBtn" class="primary" type="button"></button>
          <button id="stepBtn" type="button"></button>
          <select id="speedSel">
            <option value="1.6" id="spSlow"></option>
            <option value="1" selected id="spNorm"></option>
            <option value="0.45" id="spFast"></option>
            <option value="0.15" id="spTurbo"></option>
          </select>
          <button id="quitBtn" type="button"></button>
        </div>
      </div>
      <div class="panel agent-panel">
        <details>
          <summary id="liveSummary"></summary>
          <div class="field">
            <label>PROMPT</label>
            <textarea id="livePrompt"></textarea>
          </div>
          <div class="slider-grid">
            <div class="slider-item">
              <label><span id="luKelly"></span><span class="val" id="lvKelly"></span></label>
              <input type="range" id="lsKelly" min="5" max="100">
            </div>
            <div class="slider-item">
              <label><span id="luEdge"></span><span class="val" id="lvEdge"></span></label>
              <input type="range" id="lsEdge" min="0" max="15">
            </div>
            <div class="slider-item">
              <label><span id="luConf"></span><span class="val" id="lvConf"></span></label>
              <input type="range" id="lsConf" min="0" max="100">
            </div>
            <div class="slider-item">
              <label><span id="luContra"></span><span class="val" id="lvContra"></span></label>
              <input type="range" id="lsContra" min="-100" max="100">
            </div>
          </div>
          <span class="apply-note" id="applyNote"></span>
        </details>
      </div>
      <div class="panel">
        <h3 id="logTitle">账本</h3>
        <div class="logbox" id="logbox"></div>
      </div>
    </div>
  </section>

  <footer class="credits" id="footerNote"></footer>
</div>

<!-- ============ 结算 ============ -->
<div class="overlay" id="finalOverlay">
  <div class="final">
    <h2 id="finalTitle">收 盘 结 算</h2>
    <div class="rating" id="finalRating"></div>
    <div class="big-final num" id="finalBankroll"></div>
    <div style="text-align:center" id="finalSpark"></div>
    <div class="stat-grid" id="finalStats"></div>
    <table id="finalCatTable"></table>
    <table id="finalBets"></table>
    <div class="btn-row">
      <button class="primary" id="againSame" type="button"></button>
      <button id="againNew" type="button"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   事件街 Event Street — agent 试炼场（中英双语）
   所有事件为 2025 年真实历史事件，结算数字均经 Alpha Vantage 核实。
   All events are real 2025 markets; settlement numbers verified
   against Alpha Vantage daily data.
   ================================================================ */

/* ---------- 语言 ---------- */
let LANG = localStorage.getItem('es_lang') || 'zh';

const UI = {
  zh: {

/* ---------- 确定性随机 ---------- */
function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

(function buildTiles() {

    if (CORNERS[p]) { TILES.push({ pos: p, corner: CORNERS[p] }); continue; }

}

/* ---------- 主循环 ---------- */
function delay(ms) {
  return new Promise(res => {
    const t0 = performance.now();
    (function tick() {
      if (S.over) return res();
      if (S.paused && !S.stepOnce) return setTimeout(tick, 100);
      if (performance.now() - t0 >= ms * S.speed) return res();
      setTimeout(tick, 40);
    })();
  });
}
async function waitIfPaused() {
  while (S.paused && !S.stepOnce && !S.over) await new Promise(r => setTimeout(r, 100));
  S.stepOnce = false;
}

async function gameLoop() {
  while (!S.over) {
    await waitIfPaused();
    if (S.rolls >= S.maxRolls) { endGame('time'); break; }
    if (S.bankroll < 10) { endGame('broke'); break; }
    if (Object.values(S.decks).every(d => d.length === 0)) { endGame('empty'); break; }

    const steps = 1 + Math.floor(S.rng() * 6);
    S.rolls++;
    $('diceBox').textContent = '⚀⚁⚂⚃⚄⚅'[steps - 1];
    await delay(500);

    for (let i = 0; i < steps; i++) {
      const prev = S.pos;
      S.pos = (S.pos + 1) % 24;
      if (S.pos === 0 && prev !== 0) {
        S.bankroll += 100;
        sysMsg(T().payday);
        S.equity.push(S.bankroll);
        refreshCenter(1);
      }
      placePawn(S.pos);
      await delay(120);
    }
    refreshCenter(0);
    await delay(300);

    const tile = TILES[S.pos];
    if (tile.corner) {
      await handleCorner(tile.corner);
    } else {
      await handleNpcTile(tile.cat);
    }
    await delay(700);
  }
}

async function handleCorner(c) {
  const t = T();
  if (c.key === 'go') {
    sysMsg(t.goCorner);
  } else if (c.key === 'tax') {
    const tax = Math.max(20, Math.round(S.bankroll * 0.05));
    S.bankroll -= tax;
    S.equity.push(S.bankroll);
    sysMsg(t.tax(tax));
    refreshCenter(-1);
  } else if (c.key === 'rumor') {
    S.rumorBuff = true;
    sysMsg(t.rumor);
  } else if (c.key === 'halt') {
    sysMsg(t.halt);
  }
}

/* ---------- NPC 格子：出题 → agent 决策 → 开盅 ---------- */
function drawCard(cat) {
  if (S.decks[cat].length) return { card: S.decks[cat].shift(), borrowed: null };
  for (const c of Object.keys(S.decks)) {
    if (S.decks[c].length) return { card: S.decks[c].shift(), borrowed: c };
  }
  return { card: null, borrowed: null };
}

function revealFirst(card) {
  const r = cardT(card).reveal;
  const stop = LANG === 'zh' ? '。' : '.';
  const i = r.indexOf(stop);
  return i > 0 ? r.slice(0, i) : r;
}

async function handleNpcTile(cat) {
  const t = T();
  const { card, borrowed } = drawCard(cat);
  if (!card) { sysMsg(t.allClear); return; }
  const host = borrowed || cat;
  const hostT = catT(host);
  if (borrowed) sysMsg(t.referral(catT(cat).npc, hostT.npc));

  const taunt = hostT.taunts[Math.floor(S.rng() * hostT.taunts.length)];
  const ct = cardT(card);
  const pctYes = Math.round(card.yesPrice * 100);
  npcMsg(host, `
    「${taunt}」
    <div class="intel">
      <b>📅 ${ct.date} · ${ct.mask}</b>
      <ul>${ct.intel.map(x => `<li>${x}</li>`).join('')}</ul>
      <div class="quote-line">🎯 ${ct.q}<br>
        YES <span class="px">${pctYes}¢</span> · NO <span class="px">${100 - pctYes}¢</span>
        <span style="font-weight:400;font-size:11.5px;color:#7A6B3E">${t.quoteLine}</span>
      </div>
    </div>
  `);
  await delay(1400);
  await waitIfPaused();

  const thinking = el('div', 'msg agent', `<div class="who">${S.avatar} ${S.name}</div>${t.thinking}`);
  feedAdd(thinking);
  const t0 = performance.now();
  let dec;
  try {
    dec = S.brain === 'api' ? await claudeDecide(card) : simDecide(card);
  } catch (err) {
    toast(t.apiFail(err.message || err));
    dec = simDecide(card);
  }
  const think = Math.max(0, 900 - (performance.now() - t0));
  await delay(think);
  thinking.remove();

  const maxStake = Math.floor(S.bankroll * 0.4);
  if (dec.action !== 'skip') {
    dec.stake = Math.round(Math.min(Math.max(dec.stake || 0, 10), maxStake));
    if (dec.stake < 10) dec.action = 'skip';
  }

  if (dec.action === 'skip') {
    agentMsg(`${t.skipBet}${dec.reason || ''}`);
    const rv = el('div', 'msg reveal-skip', `${t.revealSkip(revealFirst(card), card.outcome)}${card.verified ? '' : ' <span class="unverified">' + t.unverified + '</span>'}`);
    await delay(1100); feedAdd(rv);
    addLog(card, dec, 0);
    return;
  }

  const side = dec.action;
  const price = side === 'yes' ? card.yesPrice : 1 - card.yesPrice;
  const pot = Math.round(dec.stake * (1 - price) / price);
  agentMsg(`${t.buyLine(side, Math.round(price * 100), dec.stake, pot)}<br><span style="color:var(--text-dim)">${dec.reason || ''}</span>`);
  await delay(1500);
  await waitIfPaused();

  const win = (side === 'yes') === (card.outcome === 'YES');
  let pl;
  if (win) {
    pl = pot;
    if (S.rumorBuff) { pl = Math.round(pl * 1.25); }
  } else {
    pl = -dec.stake;
  }
  const usedRumor = S.rumorBuff && win;
  S.rumorBuff = false; // 无论输赢，下一注即消耗
  S.bankroll += pl;
  S.equity.push(S.bankroll);

  const rv = el('div', 'msg ' + (win ? 'reveal-win' : 'reveal-loss'), `
    <b>${t.revealHead(card.outcome)}</b>${card.verified ? '' : ' <span class="unverified">' + t.unverified + '</span>'}<br>
    ${cardT(card).reveal}<br>
    <span class="${win ? 'pl-pos' : 'pl-neg'}">${t.betResult(fmt(pl), usedRumor, Math.round(S.bankroll))}
  `);
  feedAdd(rv);
  refreshCenter(pl);
  addLog(card, dec, pl);
}

function addLog(card, dec, pl) {
  const t = T();
  const ticker = card.zh.reveal.match(/（([A-Z]{2,6})）/);
  const sideTxt = dec.action === 'skip' ? t.skipMark : (dec.action === 'yes' ? 'YES' : 'NO') + ' ' + dec.stake;
  S.log.push({ card, dec, pl });
  const row = el('div', 'logrow');
  row.innerHTML = `
    <span class="l-left">${CATS[card.cat].emoji} ${ticker ? ticker[1] : cardT(card).mask.slice(0, 12)} · ${sideTxt}</span>
    <span class="l-right num ${pl > 0 ? 'pl-pos' : pl < 0 ? 'pl-neg' : ''}" >${dec.action === 'skip' ? '—' : fmt(pl)}</span>
  `;
  $('logbox').prepend(row);
}

/* ---------- 模拟脑 ---------- */
function simDecide(card) {
  const t = S.traits;
  const tt = T();
  const pm = card.yesPrice;
  const truth = card.outcome === 'YES' ? 1 : -1;
  const noise = (S.rng() * 2 - 1) * 0.12;
  let pa = pm + t.conf * card.hintMag * truth + (1 - t.conf) * noise + t.contra * (0.5 - pm) * 0.35;
  pa = Math.min(0.97, Math.max(0.03, pa));
  const edgeYes = pa - pm;
  const side = edgeYes >= 0 ? 'yes' : 'no';
  const edge = Math.abs(edgeYes);
  if (edge < t.edge) {
    return { action: 'skip', reason: tt.simSkipReason(Math.round(pa * 100), Math.round(pm * 100), (edge * 100).toFixed(1), Math.round(t.edge * 100)) };
  }
  const price = side === 'yes' ? pm : 1 - pm;
  const kellyF = edge / (1 - price);
  let stake = Math.round(S.bankroll * Math.min(0.4, kellyF * t.kelly * 2));
  stake = Math.max(10, stake);
  return {
    action: side, stake,
    reason: tt.simBetReason(Math.round(pa * 100), Math.round(pm * 100), side, (edge * 100).toFixed(1), t.kelly.toFixed(2), stake),
  };
}

/* ---------- Claude 脑 ---------- */
async function claudeDecide(card) {
  const ct = cardT(card);
  const pctYes = Math.round(card.yesPrice * 100);
  const histBrief = S.log.slice(-5).map(l =>
    `${l.dec.action === 'skip' ? T().skipMark : (l.dec.action + ' ' + l.dec.stake)} → ${l.pl > 0 ? '+' : ''}${l.pl}`).join('; ') || T().firstBet;

  const system = LANG === 'zh'
    ? `你是玩家在大富翁式游戏「事件街」里的交易 agent。玩家为你写的人格与策略指令：
---
${S.prompt || '（玩家没写，按理性期望值最大化行事）'}
---
规则：NPC 给出一个被 mask 的真实历史事件的赛前情报和一个二元盘。报价即隐含概率（YES x¢ 表示买 YES 每股成本 x 美分、结算为 1 或 0）。你要选择买 YES、买 NO 或跳过，并给出下注金额（整数，最低 10，不超过当前资金的 40%）。你只能依据情报和你的策略，禁止猜测真实标的名称。报价可能失准——那就是你的 edge 来源；也可能没有 edge——跳过完全合法。`
    : `You are the player's trading agent in "Event Street", a Monopoly-style game. The player's persona & strategy instructions for you:
---
${S.prompt || '(none given — act as a rational EV maximizer)'}
---
Rules: an NPC bookmaker presents pre-event intel for a masked real historical event plus a binary market. The quote is the implied probability (YES at x¢ costs x cents per share, settles at 1 or 0). Choose buy YES, buy NO, or skip, and give an integer stake (min 10, max 40% of current bankroll). Use only the intel and your strategy; never guess the real ticker. Quotes may be miscalibrated — that's your edge; there may be no edge at all — skipping is perfectly legal.`;

  const user = LANG === 'zh'
    ? `【当前资金】${Math.round(S.bankroll)} 代币
【最近下注】${histBrief}
【盘面】${ct.date} · ${ct.mask}
情报：
${ct.intel.map(x => '- ' + x).join('\n')}
问题：${ct.q}
报价：YES ${pctYes}¢ / NO ${100 - pctYes}¢
请决策。`
    : `[Bankroll] ${Math.round(S.bankroll)} chips
[Recent bets] ${histBrief}
[Market] ${ct.date} · ${ct.mask}
Intel:
${ct.intel.map(x => '- ' + x).join('\n')}
Question: ${ct.q}
Quote: YES ${pctYes}¢ / NO ${100 - pctYes}¢
Decide.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': S.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: S.apiModel,
      max_tokens: 4096,
      output_config: {
        effort: 'low',
        format: {
          type: 'json_schema',
          schema: {
            type: 'object',
            properties: {
              action: { type: 'string', enum: ['yes', 'no', 'skip'] },
              stake: { type: 'integer' },
              reason: { type: 'string', description: LANG === 'zh' ? '一两句话的中文决策理由，60字以内' : 'One or two short English sentences of reasoning, under 200 chars' },
            },
            required: ['action', 'stake', 'reason'],
            additionalProperties: false,
          },
        },
      },
      system,
      messages: [{ role: 'user', content: user }],
    }),
  });
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}${body ? ': ' + body.slice(0, 120) : ''}`);
  }
  const data = await res.json();
  if (data.stop_reason === 'refusal') throw new Error(LANG === 'zh' ? '模型拒答' : 'model refused');
  const txt = (data.content || []).find(b => b.type === 'text');
  if (!txt) throw new Error(LANG === 'zh' ? '空响应' : 'empty response');
  return JSON.parse(txt.text);
}

/* ---------- 迷你/大 sparkline ---------- */
function drawSpark(svg, series, w, h, big) {
  if (!svg) return;
  const n = series.length;
  const min = Math.min(...series), max = Math.max(...series);
  const span = Math.max(1, max - min);
  const pad = big ? 8 : 3;
  const X = i => pad + (n === 1 ? 0 : i / (n - 1)) * (w - pad * 2);
  const Y = v => h - pad - ((v - min) / span) * (h - pad * 2);
  let d = '';
  series.forEach((v, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); });
  const area = d + `L${X(n - 1).toFixed(1)},${h - pad}L${X(0).toFixed(1)},${h - pad}Z`;
  const base = Y(1000);
  const last = series[n - 1];
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `
    ${big ? `<line x1="${pad}" y1="${base}" x2="${w - pad}" y2="${base}" stroke="#3A5A44" stroke-dasharray="3 4" stroke-width="1"/>` : ''}
    <path d="${area}" fill="rgba(201,162,39,0.14)"/>
    <path d="${d}" fill="none" stroke="#E3BC45" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(n - 1)}" cy="${Y(last)}" r="${big ? 4 : 2.6}" fill="${last >= 1000 ? '#6FBF8F' : '#D96A5B'}"/>
  `;
}

/* ---------- 控制 ---------- */
$('pauseBtn').onclick = () => {
  S.paused = !S.paused;
  $('pauseBtn').textContent = S.paused ? T().resume : T().pause;
};
$('stepBtn').onclick = () => { if (S.paused) S.stepOnce = true; };
$('speedSel').onchange = e => { S.speed = +e.target.value; };
$('quitBtn').onclick = () => endGame('quit');

/* ---------- 结算 ---------- */
function endGame(whyKey) {
  if (S.over) return;
  S.over = true; S.running = false;
  const t = T();
  sysMsg(t.endBell(t.endWhy[whyKey] || whyKey));

  const bets = S.log.filter(l => l.dec.action !== 'skip');
  const wins = bets.filter(l => l.pl > 0);
  const skips = S.log.length - bets.length;
  const pl = S.bankroll - 1000;
  const best = bets.slice().sort((a, b) => b.pl - a.pl)[0];
  const worst = bets.slice().sort((a, b) => a.pl - b.pl)[0];

  const rating = t.ratings.find(r => S.bankroll >= r[0])[1];

  $('finalRating').textContent = rating;
  const fb = $('finalBankroll');
  fb.textContent = Math.round(S.bankroll) + ' ' + t.chips;
  fb.style.color = pl >= 0 ? 'var(--win)' : 'var(--loss)';

  $('finalSpark').innerHTML = '<svg id="bigSpark" width="560" height="120" style="max-width:100%"></svg>';
  drawSpark($('bigSpark'), S.equity, 560, 120, true);

  $('finalStats').innerHTML = `
    <div class="stat"><div class="k">${t.stTotal}</div><div class="v num" style="color:${pl >= 0 ? 'var(--win)' : 'var(--loss)'}">${fmt(pl)} (${(pl / 10).toFixed(1)}%)</div></div>
    <div class="stat"><div class="k">${t.stBets}</div><div class="v num">${bets.length} / ${skips}</div></div>
    <div class="stat"><div class="k">${t.stHit}</div><div class="v num">${bets.length ? Math.round(wins.length / bets.length * 100) + '%' : '—'}</div></div>
  `;

  const catAgg = {};
  for (const l of bets) {
    const c = l.card.cat;
    catAgg[c] = catAgg[c] || { n: 0, pl: 0 };
    catAgg[c].n++; catAgg[c].pl += l.pl;
  }
  $('finalCatTable').innerHTML = `
    <tr><th>${t.thCat}</th><th class="r">${t.thN}</th><th class="r">${t.thPL}</th></tr>
    ${Object.entries(catAgg).map(([c, a]) => `
      <tr><td>${CATS[c].emoji} ${catT(c).name}</td><td class="r num">${a.n}</td>
      <td class="r num ${a.pl >= 0 ? 'pl-pos' : 'pl-neg'}">${fmt(a.pl)}</td></tr>`).join('')}
  `;

  const tick = l => { const m = l.card.zh.reveal.match(/（([A-Z]{2,6})）/); return m ? m[1] : cardT(l.card).mask.slice(0, 8); };
  let betRows = '';
  if (best && best.pl > 0) betRows += `<tr><td>${t.bestBet}</td><td colspan="2">${tick(best)} ${best.dec.action.toUpperCase()} ${best.dec.stake} <span class="pl-pos num">${fmt(best.pl)}</span></td></tr>`;
  if (worst && worst.pl < 0) betRows += `<tr><td>${t.worstBet}</td><td colspan="2">${tick(worst)} ${worst.dec.action.toUpperCase()} ${worst.dec.stake} <span class="pl-neg num">${fmt(worst.pl)}</span></td></tr>`;
  $('finalBets').innerHTML = betRows;

  $('finalOverlay').classList.add('show');
}

$('againSame').onclick = () => {
  $('finalOverlay').classList.remove('show');
  $('gameView').classList.remove('show');
  $('setupView').style.display = 'block';
  window.scrollTo({ top: 0 });
};

  $('seedInput').value = 'seed-' + Math.random().toString(36).slice(2, 8);
  $('finalOverlay').classList.remove('show');
  $('gameView').classList.remove('show');
  $('setupView').style.display = 'block';
  window.scrollTo({ top: 0 });
};
